<body><div id="app"><div class="center-card card">Loading secure CRM…</div></div><div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const PROJECT_URL='https://zfihwiolrxddfphehngt.supabase.co';
// Public browser key ONLY. Never use Supabase secret/service_role here.
const PUBLISHABLE_KEY='sb_publishable_U_bLYn66mCOH_liYsGEDFw_bL2WzC6K';
const BRAND='GS Enterprises Digital';
const WEBSITE='https://gsenterprisesdigital-sudo.github.io/TESTING/services.html';
const CONTACT_COLUMNS='id,user_id,source_key,source_row_number,first_name,last_name,name,linkedin_url,email,company,title,segment,pathway,industry,priority,score,rank,confidence,status,notes,last_touch,follow_up,next_action,record_quality';
const app=document.getElementById('app');
let sb=null,user=null,contacts=[],templates=[],activities=[],settings={daily_outreach_target:15,default_followup_days:4};
let view='home', selectedId=null, filter={q:'',priority:'All',role:'All',industry:'All',status:'All'}, page=1, perPage=16;
let drafts={}, chosenTemplates={}, templateEditId=null, templateSearch='', messages={}, activitiesLeadId=null, dailySent=0, loading=false;
const statuses=['Not contacted','Sent','Replied','Follow-up','Meeting','Won','Lost','Research','Needs identification','Do not contact'];
const stages=[['first_touch','First outreach'],['follow_up_1','Follow-up 1'],['follow_up_2','Follow-up 2'],['positive_reply','Positive reply'],['meeting_request','Meeting request']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
function toast(msg,isError=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(isError?' fail':'');t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4200)}
function initials(r){return (r.name||[r.first_name,r.last_name].filter(Boolean).join(' ')||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function contactName(r){return r.name||[r.first_name,r.last_name].filter(Boolean).join(' ')||'Unknown contact'}
function firstName(r){const raw=(r.first_name||contactName(r).split(/\s+/)[0]||'').trim();return raw||'there'}
function role(r){const title=(r.title||'').toLowerCase(),seg=(r.segment||'').toLowerCase(),pathway=(r.pathway||'').toLowerCase();if(pathway.includes('agency partnership'))return 'Agency partner';if(!/intern|assistant|office|trainee/.test(title)&&/(\bfounder\b|co.founder|\bowner\b|\bproprietor\b)/.test(title))return 'Founder';if(/\bceo\b|chief executive|managing director|chairman/.test(title)||seg.includes('ceo / managing'))return 'CEO';if(/\bdirector\b/.test(title))return 'Director';if(/marketing head|chief marketing|head of growth|marketing manager|brand manager|marketing director|growth lead/.test(title)||seg.includes('marketing manager'))return 'Marketing leader';if(seg.includes('founder / owner'))return 'Founder';if(seg.includes('director / executive'))return 'Director';return 'Other'}
const isDecision=r=>['Founder','CEO','Director'].includes(role(r));
const isReview=r=>!r.linkedin_url||!r.name||!(r.industry||'').trim()||(r.industry||'').toLowerCase()==='unclassified';
function rankScore(r){return ({Founder:500,CEO:480,Director:460,'Marketing leader':260,'Agency partner':230,Other:0}[role(r)]||0)+({A:160,B:70,C:10,V:0}[r.priority]||0)+(Number(r.score)||0)/2}
function sorted(a){return [...a].sort((x,y)=>rankScore(y)-rankScore(x)||((Number(x.rank)||9999)-(Number(y.rank)||9999))||contactName(x).localeCompare(contactName(y)))}
function filteredContacts(){const q=filter.q.toLowerCase().trim();return sorted(contacts.filter(r=>{if(q&&![r.name,r.first_name,r.last_name,r.company,r.title,r.linkedin_url,r.industry].some(x=>String(x||'').toLowerCase().includes(q)))return false;if(filter.priority!=='All'&&(r.priority||'Unrated')!==filter.priority)return false;if(filter.role!=='All'&&role(r)!==filter.role)return false;if(filter.industry!=='All'&&(r.industry||'Needs review')!==filter.industry)return false;if(filter.status==='Due'){if(!r.follow_up||r.status==='Won'||r.status==='Lost'||r.status==='Do not contact')return false;return r.follow_up<=dateLocal()}if(filter.status==='Needs review')return isReview(r);if(filter.status!=='All'&&(r.status||'Not contacted')!==filter.status)return false;return true}))}
function dateLocal(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateAdd(days){const d=new Date();d.setDate(d.getDate()+Number(days||4));return dateLocal(d)}
function due(r){return r.follow_up&&r.follow_up<=dateLocal()&&!(new Set(['Won','Lost','Do not contact'])).has(r.status)}
function dueLeads(){return sorted(contacts.filter(due))}
function opt(arr,current){return arr.map(x=>`<option value="${attr(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function selectLead(id){selectedId=id;activities=[];activitiesLeadId=null;view='outreach';render();loadActivities(id)}
function selected(){return contacts.find(r=>r.id===selectedId)||null}
function ensureDraft(r){if(!drafts[r.id])drafts[r.id]={notes:r.notes||'',follow_up:r.follow_up||'',next_action:r.next_action||'',status:r.status||'Not contacted'};if(!chosenTemplates[r.id])chosenTemplates[r.id]=suggestTemplate(r)?.id||'';if(messages[r.id]===undefined)messages[r.id]=formatMessage(templates.find(t=>t.id===chosenTemplates[r.id])?.body||defaultMessage(),r)}
function formatMessage(str,r){const v={first_name:firstName(r),name:contactName(r),company:r.company||'your organization',brand:BRAND,website:WEBSITE,role:r.title||'your role'};return String(str||'').replace(/\{first_name\}(?!\s*ji\b)/gi,`${v.first_name} ji`).replace(/\{(first_name|name|company|brand|website|role)\}/gi,(_m,k)=>v[k.toLowerCase()]||'')}
function defaultMessage(){return `Hi {first_name} ji,\n\nI recently started GS Enterprises Digital, a digital marketing agency, and I'm learning how to grow the business.\n\nI noticed your work at {company} and would love to learn from your experience.\n\nWhat's one thing you would prioritize when building a business from scratch?\n\nI'd really appreciate your perspective.\n\nWebsite: {website}\n\nThank you!`}
function suggestTemplate(r){const active=templates.filter(t=>t.is_active&&t.stage==='first_touch');const rr=role(r),ii=r.industry||'';const scored=active.map(t=>{const tr=t.role_category||'',ti=t.industry||'';if(tr&&tr!==rr)return null;if(ti&&ti!==ii)return null;let score=(tr?60:0)+(ti?100:0)+(t.priority||0);if(t.template_key?.startsWith('advice_'))score+=70;return {t,score}}).filter(Boolean).sort((a,b)=>b.score-a.score);return scored[0]?.t||active.find(t=>t.template_key==='advice_all')||active[0]||null}
function nStatus(st){return st==='Sent'?'sent':(st==='Needs identification'||st==='Research'?'review':'')}
function statusTag(r){return `<span class="tag ${nStatus(r.status)}">${esc(r.status||'Not contacted')}</span>`}
function tagLead(r){return `<span class="tag ${r.priority==='A'?'a':''}">${esc(r.priority||'Unrated')}</span>`}
function leadItem(r){return `<button type="button" class="lead-item ${selectedId===r.id?'active':''}" data-lead="${attr(r.id)}"><span class="avatar">${esc(initials(r))}</span><span class="lead-core"><span class="lead-title">${esc(contactName(r))}</span><span class="lead-meta">${esc(r.title||role(r))} · ${esc(r.company||'Company missing')}</span></span><span style="display:grid;gap:5px;justify-items:end">${tagLead(r)}<span class="tag ${due(r)?'due':''}">${esc(due(r)?'Due':role(r))}</span></span></button>`}
function shell(content,title,desc){const nav=[['home','⌂','Home'],['leads','☷','Leads'],['outreach','↗','Outreach'],['templates','▤','Templates'],['reports','▥','Reports']];return `<div class="app-shell"><aside class="sidebar"><div class="logo"><span class="logo-icon">GS</span><span><strong>GS Enterprises<br>Digital</strong><small>OUTREACH CRM</small></span></div><nav class="nav-links">${nav.map(([k,ic,l])=>`<button type="button" class="nav-button ${view===k?'active':''}" data-view="${k}"><span class="nav-icon">${ic}</span>${l}</button>`).join('')}</nav><div class="side-bottom"><strong>Manual · Relationship First</strong>Copy and open are separate from Mark Sent. Nothing is automatically sent on LinkedIn.</div></aside><main class="app-main"><header class="topbar"><div><span class="eyebrow">GS Enterprises Digital</span><h1 class="heading">${esc(title)}</h1><p class="subheading">${esc(desc)}</p></div><div class="top-actions"><span class="pill green">● Connected</span><button class="button small" id="refresh-data">↻ Refresh</button></div></header>${content}<p class="footnote">Private single-user workspace · Data stored in Supabase · LinkedIn messages sent manually</p></main><nav class="mobile-nav">${nav.map(([k,ic,l])=>`<button type="button" data-view="${k}" class="${view===k?'active':''}"><span class="nav-icon">${ic}</span>${l}</button>`).join('')}</nav></div>`}
function homePage(){const due=dueLeads().length,not=contacts.filter(r=>!r.status||r.status==='Not contacted').length,sent=contacts.filter(r=>r.status==='Sent').length,decision=contacts.filter(isDecision).length,rate=Math.min(100,Math.round(100*dailySent/(settings.daily_outreach_target||15))),todays=sorted(contacts.filter(r=>(!r.status||r.status==='Not contacted')&&r.linkedin_url)).slice(0,7);
return `<section class="metric-grid"><div class="card metric"><span class="metric-icon">◫</span><div><b>${contacts.length.toLocaleString()}</b><small>Total connections</small></div></div><div class="card metric"><span class="metric-icon">◎</span><div><b>${decision}</b><small>Decision makers</small></div></div><div class="card metric"><span class="metric-icon">↗</span><div><b>${sent}</b><small>Marked Sent</small></div></div><div class="card metric"><span class="metric-icon">◷</span><div><b>${due}</b><small>Follow-ups due</small></div></div></section><div class="two-grid"><section class="card card-pad"><div class="section-heading"><div><h2>Today's priority outreach</h2><p>Founder → CEO → Director, then priority A</p></div><button class="button small" data-view="outreach">Start outreach →</button></div><div class="mini-queue">${todays.length?todays.map(leadItem).join(''):'<div class="empty">No pending contacts with LinkedIn links.</div>'}</div></section><section style="display:grid;align-content:start;gap:15px"><div class="card card-pad"><div class="section-heading"><div><h2>Daily target</h2><p>Manual messages confirmed sent today</p></div><span class="pill">${dailySent} / ${settings.daily_outreach_target||15}</span></div><div class="progress"><span style="width:${rate}%"></span></div><p class="subheading" style="margin-top:10px">${rate}% complete · You can change the target in Reports</p></div><div class="card card-pad"><h2 style="font-size:16px;margin:0 0 13px">Your outreach overview</h2><div class="stat-row"><span>Not contacted</span><strong>${not}</strong></div><div class="stat-row"><span>Replied / meetings</span><strong>${contacts.filter(r=>['Replied','Meeting'].includes(r.status)).length}</strong></div><div class="stat-row"><span>Won leads</span><strong>${contacts.filter(r=>r.status==='Won').length}</strong></div><div class="stat-row"><span>Needs review (classification / URL)</span><strong>${contacts.filter(isReview).length}</strong></div><div class="horizontal" style="margin-top:17px"><button class="button small" data-quick="due">View due follow-ups</button><button class="button small" data-quick="review">Review contacts</button></div></div></section></div>`}
function filterHtml(){const industries=[...new Set(contacts.map(x=>x.industry||'Needs review'))].sort();return `<div class="filters"><input id="q" class="field search" placeholder="Search name, company or role…" value="${attr(filter.q)}" aria-label="Search contacts"><select class="field" id="role-filter" aria-label="Role">${opt(['All','Founder','CEO','Director','Marketing leader','Agency partner','Other'],filter.role)}</select><select class="field" id="priority-filter" aria-label="Priority">${opt(['All','A','B','C','V','Unrated'],filter.priority)}</select><select class="field" id="status-filter" aria-label="Status">${opt(['All','Due','Needs review',...statuses],filter.status)}</select><select class="field" id="industry-filter" aria-label="Industry">${opt(['All',...industries],filter.industry)}</select><button class="button small" id="reset-filters">Reset</button></div>`}
function queuePane(){const list=filteredContacts(),totalPages=Math.max(1,Math.ceil(list.length/perPage));page=Math.min(page,totalPages);const chunk=list.slice((page-1)*perPage,page*perPage);return `<div class="card panel-list"><div class="section-heading"><div><h2>Priority queue</h2><p>${list.length.toLocaleString()} matching contacts</p></div></div><div class="result-list">${chunk.length?chunk.map(leadItem).join(''):'<div class="empty">No contacts match these filters.</div>'}</div><div class="pager"><button class="button small" id="prev" ${page<=1?'disabled':''}>← Previous</button><span>Page ${page} / ${totalPages}</span><button class="button small" id="next" ${page>=totalPages?'disabled':''}>Next →</button></div></div>`}
function detailPane(){const r=selected();if(!r)return `<div class="card card-pad empty"><h3>Select a contact</h3>Choose a contact from the priority queue to prepare a personalized message.</div>`;ensureDraft(r);const d=drafts[r.id],currentTemplate=templates.find(t=>t.id===chosenTemplates[r.id]);const message=messages[r.id];let options=templates.filter(t=>t.is_active).sort((a,b)=>Number(b.id===currentTemplate?.id)-Number(a.id===currentTemplate?.id)||((b.priority||0)-(a.priority||0)));return `<article class="card lead-panel"><div class="lead-intro"><span class="avatar">${esc(initials(r))}</span><div style="flex:1;min-width:0"><h2>${esc(contactName(r))}</h2><p>${esc(r.title||'Role not specified')} · ${esc(r.company||'Company not specified')}</p></div>${tagLead(r)}</div><div class="horizontal"><span class="tag role">${esc(role(r))}</span><span class="tag">${esc(r.industry||'Industry needs review')}</span>${statusTag(r)}${due(r)?'<span class="tag due">Follow-up due</span>':''}</div>${!r.linkedin_url?'<p class="alert" style="margin-top:13px">LinkedIn URL missing. Verify this contact before outreach.</p>':''}<section class="composer"><div class="composer-top"><div><span class="eyebrow">01 · Message first</span><h3>Personalized outreach</h3></div><span class="tag">Professional</span></div><label class="small-label" for="message-template">Choose saved template</label><select class="field wide" id="message-template"><option value="">Custom / default message</option>${options.map(t=>`<option value="${attr(t.id)}" ${chosenTemplates[r.id]===t.id?'selected':''}>${esc(t.name)} · ${esc(stages.find(x=>x[0]===t.stage)?.[1]||t.stage)}</option>`).join('')}</select><div class="horizontal" style="justify-content:space-between;margin:10px 0 6px"><label class="small-label" for="message-body" style="margin:0">Edit message for this person</label><span class="tag">{first_name} → ${esc(firstName(r))} ji</span></div><textarea class="message-editor" id="message-body" spellcheck="true">${esc(message)}</textarea><div class="action-grid"><button class="button primary" id="copy-message">▣ Copy Message</button><button class="button" id="open-linkedin" ${!r.linkedin_url?'disabled':''}>↗ Open LinkedIn</button><button class="button green" id="mark-sent" ${r.status==='Do not contact'?'disabled':''}>✓ Mark Sent</button></div><p class="composer-hint">Copy and Open never mark a lead as Sent. Send your message manually on LinkedIn, then use Mark Sent.</p><div class="horizontal"><button class="button ghost small" id="next-lead">Next pending contact →</button><button class="button ghost small" data-view="templates">Manage templates ↗</button></div></section><div class="panel-divider"></div><section><span class="eyebrow">02 · CRM tracking</span><h3 class="pane-heading" style="margin-top:5px">Status, follow-up & notes</h3><div class="form-grid"><div class="form-cell"><label class="small-label" for="lead-status">CRM status</label><select class="field wide" id="lead-status">${opt(statuses,d.status)}</select></div><div class="form-cell"><label class="small-label" for="follow-up">Follow-up date</label><input class="field wide" type="date" id="follow-up" value="${attr(d.follow_up||'')}"></div><div class="form-cell full"><label class="small-label" for="next-action">Next action</label><input class="field wide" id="next-action" placeholder="e.g. Check for reply on Friday" value="${attr(d.next_action||'')}"></div><div class="form-cell full"><label class="small-label" for="notes">Private notes</label><textarea class="field wide" id="notes" rows="4" placeholder="Context, what they said, ideas, meeting details…">${esc(d.notes)}</textarea></div></div><div class="horizontal" style="margin-top:13px"><button class="button primary" id="save-lead">Save CRM details</button><span class="muted" style="font-size:11px">Saved to Supabase only when you tap Save</span></div></section><div class="panel-divider"></div><section><span class="eyebrow">03 · History</span><h3 class="pane-heading" style="margin-top:5px">Activity timeline</h3>${activitiesLeadId===r.id?activityHtml():'<p class="muted" style="font-size:12px">Loading activity…</p>'}</section><div class="panel-divider"></div><section><span class="eyebrow">04 · Profile</span><h3 class="pane-heading" style="margin-top:5px">Contact information</h3><div class="stat-row"><span>Company</span><strong>${esc(r.company||'—')}</strong></div><div class="stat-row"><span>Designation</span><strong>${esc(r.title||'—')}</strong></div><div class="stat-row"><span>Email</span><strong>${esc(r.email||'—')}</strong></div><div class="stat-row"><span>Lead score</span><strong>${esc(r.score??'—')}</strong></div><div class="stat-row"><span>Last touch</span><strong>${esc(r.last_touch||'—')}</strong></div><div class="stat-row"><span>Lead source</span><strong>LinkedIn CSV</strong></div></section></article>`}
function activityHtml(){if(!activities.length)return '<p class="muted" style="font-size:12px">No outreach activity saved yet.</p>';return `<div class="timeline">${activities.map(a=>`<div class="activity"><strong>${esc(a.event_type.replaceAll('_',' '))}</strong><small>${esc(new Date(a.occurred_at).toLocaleString('en-IN'))}</small>${a.details?`<p>${esc(a.details)}</p>`:''}${a.message_snapshot?`<details style="margin-top:6px"><summary class="muted">View sent message</summary><p>${esc(a.message_snapshot)}</p></details>`:''}</div>`).join('')}</div>`}
function leadsPage(){return `${filterHtml()}<div class="card card-pad" style="margin-bottom:13px"><div class="section-heading" style="margin:0"><div><h2>All connections</h2><p>Search and filter your import. Open a lead to start outreach.</p></div><span class="pill">${filteredContacts().length.toLocaleString()} results</span></div></div><div class="panel-layout">${queuePane()}${detailPane()}</div>`}
function outreachPage(){return `${filterHtml()}<div class="panel-layout outreach-layout">${queuePane()}${detailPane()}</div>`}
function templatePage(){const list=templates.filter(t=>(t.name+' '+t.industry+' '+t.role_category+' '+t.stage).toLowerCase().includes(templateSearch.toLowerCase())).sort((a,b)=>b.priority-a.priority||a.name.localeCompare(b.name));let editing=templates.find(t=>t.id===templateEditId)||null;return `<div class="template-layout"><div class="card card-pad"><div class="section-heading"><div><h2>Saved templates</h2><p>${templates.length} templates in Supabase</p></div><button class="button primary small" id="new-template">+ New</button></div><input class="field wide" id="template-search" placeholder="Find template…" value="${attr(templateSearch)}"><div class="template-list" style="margin-top:12px">${list.map(t=>`<button class="${templateEditId===t.id?'active':''}" data-template="${attr(t.id)}"><strong>${esc(t.name)} ${t.is_active?'':'(Inactive)'}</strong><small>${esc(t.role_category||'All roles')} · ${esc(t.industry||'All industries')} · ${esc(t.stage)}</small></button>`).join('')}</div></div><div class="card card-pad"><div class="section-heading"><div><span class="eyebrow">Supabase template manager</span><h2>${editing?'Edit template':'Create template'}</h2></div>${editing?'<button class="button small" id="duplicate-template">Duplicate</button>':''}</div><form id="template-form"><div class="form-grid"><div class="form-cell full"><label class="small-label">Template name</label><input required name="name" class="field wide" maxlength="120" placeholder="e.g. Founder · Relationship advice" value="${attr(editing?.name||'')}"></div><div class="form-cell"><label class="small-label">Audience role</label><select class="field wide" name="role_category">${opt(['','Founder','CEO','Director','Marketing leader','Agency partner','Other'],editing?.role_category||'')}</select></div><div class="form-cell"><label class="small-label">Message stage</label><select class="field wide" name="stage">${stages.map(([v,l])=>`<option value="${v}" ${v===(editing?.stage||'first_touch')?'selected':''}>${l}</option>`).join('')}</select></div><div class="form-cell full"><label class="small-label">Industry (optional)</label><input class="field wide" name="industry" placeholder="Leave blank for all industries, or exact imported industry" value="${attr(editing?.industry||'')}"></div><div class="form-cell"><label class="small-label">Priority (0–100)</label><input class="field wide" name="priority" type="number" min="0" max="100" value="${attr(editing?.priority??40)}"></div><div class="form-cell"><label class="small-label">Status</label><select class="field wide" name="is_active"><option value="true" ${!editing||editing.is_active?'selected':''}>Active</option><option value="false" ${editing&&!editing.is_active?'selected':''}>Inactive</option></select></div><div class="form-cell full"><label class="small-label">Editable message content</label><textarea class="field wide" style="min-height:250px" name="body" required placeholder="Hi {first_name} ji, …">${esc(editing?.body||defaultMessage())}</textarea><span class="muted" style="font-size:10px">Fields: {first_name}, {name}, {company}, {brand}, {website}, {role}. Ji will be added automatically if omitted.</span></div></div><div class="horizontal" style="margin-top:13px"><button class="button primary" type="submit">Save Template to Supabase</button>${editing?'<button type="button" class="button red" id="delete-template">Delete</button>':''}</div></form><div class="panel-divider"></div><label class="small-label">Preview with selected contact</label><div id="template-preview" class="template-preview">${esc(formatMessage(editing?.body||defaultMessage(),selected()||{first_name:'Ketan',company:'Pay Point India Network Pvt. Ltd.'}))}</div></div></div>`}
function reportsPage(){const stats=['Not contacted','Sent','Replied','Follow-up','Meeting','Won','Lost'].map(s=>[s,contacts.filter(x=>(x.status||'Not contacted')===s).length]);const total=contacts.length,review=contacts.filter(isReview).length;return `<div class="report-grid"><div class="card card-pad"><div class="section-heading"><div><h2>Outreach pipeline</h2><p>Manually tracked contact status</p></div></div>${stats.map(([s,n])=>`<div class="stat-row"><span>${s}</span><b>${n}</b></div><div class="progress" style="height:6px"><span style="width:${total?(n/total)*100:0}%"></span></div>`).join('')}</div><div style="display:grid;gap:14px;align-content:start"><div class="card card-pad"><h2 style="font-size:17px;margin:0 0 10px">Personal settings</h2><form id="settings-form"><label class="small-label">Daily outreach target</label><input class="field wide" type="number" name="daily_outreach_target" min="1" max="200" value="${settings.daily_outreach_target||15}"><label class="small-label" style="margin-top:12px">Default follow-up after (days)</label><input class="field wide" type="number" name="default_followup_days" min="1" max="60" value="${settings.default_followup_days||4}"><button class="button primary" type="submit" style="margin-top:13px">Save settings</button></form></div><div class="card card-pad"><h2 style="font-size:17px;margin:0 0 8px">Data quality</h2><div class="stat-row"><span>Total imported</span><b>${total}</b></div><div class="stat-row"><span>Profiles with LinkedIn URL</span><b>${contacts.filter(x=>x.linkedin_url).length}</b></div><div class="stat-row"><span>Missing industry or unclassified / URL</span><b>${review}</b></div><div class="horizontal" style="margin-top:13px"><button class="button" data-quick="review">Review leads</button><button class="button" id="export-csv">Export contacts</button></div></div><div class="card card-pad"><h2 style="font-size:17px;margin:0 0 8px">Security</h2><p class="muted">Session is remembered on this browser. Sign in is only needed when it expires or you sign out.</p><button class="button red" id="sign-out">Sign out</button></div></div></div>`}
function render(){if(!user)return renderLogin();let content='',title='',desc='';if(view==='home'){title='Your outreach workspace';desc='Prioritize connections, build relationships, track progress.';content=homePage()}else if(view==='leads'){title='All connections';desc='Review, filter and organize your LinkedIn network.';content=leadsPage()}else if(view==='outreach'){title='Outreach focus';desc='One person at a time · copy, open, mark sent.';content=outreachPage()}else if(view==='templates'){title='Message templates';desc='Edit once, reuse anywhere. Everything saves to Supabase.';content=templatePage()}else{title='Reports & settings';desc='See your pipeline, goals and data quality.';content=reportsPage()}app.innerHTML=shell(content,title,desc);bindCommon();if(view==='leads'||view==='outreach')bindLead();if(view==='templates')bindTemplates();if(view==='reports')bindReports()}
function bindCommon(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>selectLead(b.dataset.lead));document.getElementById('refresh-data')?.addEventListener('click',()=>loadData(true));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{filter.status=b.dataset.quick==='due'?'Due':'Needs review';filter.q='';filter.role='All';filter.priority='All';filter.industry='All';page=1;view='leads';render()})}
function bindLead(){const bind=id=>document.getElementById(id);const q=bind('q');q?.addEventListener('input',e=>{filter.q=e.target.value;page=1;let caret=e.target.selectionStart;render();const n=bind('q');n?.focus();n?.setSelectionRange(caret,caret)});[['role-filter','role'],['priority-filter','priority'],['status-filter','status'],['industry-filter','industry']].forEach(([id,k])=>{bind(id)?.addEventListener('change',e=>{filter[k]=e.target.value;page=1;render()})});bind('reset-filters')?.addEventListener('click',()=>{filter={q:'',priority:'All',role:'All',industry:'All',status:'All'};page=1;render()});bind('prev')?.addEventListener('click',()=>{page=Math.max(1,page-1);render()});bind('next')?.addEventListener('click',()=>{page++;render()});const r=selected();if(!r)return;ensureDraft(r);bind('message-template')?.addEventListener('change',e=>{chosenTemplates[r.id]=e.target.value;const t=templates.find(x=>x.id===e.target.value);messages[r.id]=formatMessage(t?.body||defaultMessage(),r);render()});bind('message-body')?.addEventListener('input',e=>messages[r.id]=e.target.value);bind('copy-message')?.addEventListener('click',async()=>{try{await copyText(messages[r.id]);toast('Message copied. Send it on LinkedIn manually.')}catch(e){toast('Could not copy: '+e.message,true)}});bind('open-linkedin')?.addEventListener('click',()=>{const url=r.linkedin_url||'';if(!/^https:\/\/([\w-]+\.)?linkedin\.com\//i.test(url)){toast('Invalid LinkedIn URL. Please verify contact.',true);return}window.open(url,'_blank','noopener,noreferrer')});bind('mark-sent')?.addEventListener('click',()=>markSent(r));bind('next-lead')?.addEventListener('click',nextPending);[['lead-status','status'],['follow-up','follow_up'],['next-action','next_action'],['notes','notes']].forEach(([id,k])=>{bind(id)?.addEventListener('input',e=>drafts[r.id][k]=e.target.value)});bind('save-lead')?.addEventListener('click',()=>saveLead(r))}
function bindTemplates(){document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{templateEditId=b.dataset.template;render()});document.getElementById('new-template')?.addEventListener('click',()=>{templateEditId=null;render()});document.getElementById('template-search')?.addEventListener('input',e=>{templateSearch=e.target.value;render();document.getElementById('template-search')?.focus()});document.getElementById('template-form')?.addEventListener('submit',saveTemplate);document.getElementById('delete-template')?.addEventListener('click',deleteTemplate);document.getElementById('duplicate-template')?.addEventListener('click',async()=>{const src=templates.find(t=>t.id===templateEditId);if(!src)return;const row={user_id:user.id,template_key:'copy_'+Date.now(),name:src.name+' (Copy)',role_category:src.role_category,industry:src.industry,stage:src.stage,priority:src.priority,body:src.body,service_focus:src.service_focus,is_active:src.is_active};try{const {data,error}=await sb.from('crm_templates').insert(row).select().single();if(error)throw error;templates.push(data);templateEditId=data.id;render();toast('Duplicate template saved')}catch(e){toast(e.message,true)}});const body=document.querySelector('textarea[name="body"]');body?.addEventListener('input',e=>{document.getElementById('template-preview').textContent=formatMessage(e.target.value,selected()||{first_name:'Ketan',company:'Pay Point India Network Pvt. Ltd.'})})}
function bindReports(){document.getElementById('settings-form')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const row={user_id:user.id,daily_outreach_target:Number(f.get('daily_outreach_target')),default_followup_days:Number(f.get('default_followup_days'))};if(!(row.daily_outreach_target>=1&&row.daily_outreach_target<=200&&row.default_followup_days>=1&&row.default_followup_days<=60)){toast('Please enter valid settings',true);return}try{const {data,error}=await sb.from('crm_settings').upsert(row,{onConflict:'user_id'}).select().single();if(error)throw error;settings={...settings,...data};toast('Settings saved to Supabase');render()}catch(err){toast(err.message,true)}});document.getElementById('sign-out')?.addEventListener('click',async()=>{const {error}=await sb.auth.signOut();if(error)return toast(error.message,true);user=null;renderLogin()});document.getElementById('export-csv')?.addEventListener('click',exportCsv)}
function nextPending(){const list=filteredContacts().filter(x=>(!x.status||x.status==='Not contacted')&&x.linkedin_url);const r=list.find(x=>x.id!==selectedId);if(!r)return toast('No other pending contact in current filter.');selectLead(r.id)}
async function copyText(s){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s);const el=document.createElement('textarea');el.value=s;el.style.cssText='position:fixed;left:-10000px';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('Copy is unavailable in this browser')}
async function markSent(r){if(r.status==='Sent'&&!confirm('This contact is already marked Sent. Log another outreach?'))return;const text=messages[r.id]||'',followup=dateAdd(settings.default_followup_days||4);if(!text.trim()){toast('Write a message first',true);return}const btn=document.getElementById('mark-sent');if(btn)btn.disabled=true;try{const patch={status:'Sent',last_touch:dateLocal(),follow_up:followup,next_action:`Check reply / follow up on ${followup}`};const {data,error}=await sb.from('connections').update(patch).eq('id',r.id).eq('user_id',user.id).select(CONTACT_COLUMNS).single();if(error)throw error;replaceContact(data);drafts[r.id]={...drafts[r.id],...patch};const activity={user_id:user.id,connection_id:r.id,event_type:'sent',channel:'LinkedIn',template_id:chosenTemplates[r.id]||null,message_snapshot:text,details:'Manually marked Sent in CRM'};const res=await sb.from('crm_activities').insert(activity);if(res.error){toast('Lead marked Sent, but history failed: '+res.error.message,true)}else{toast('Marked Sent and logged in Supabase. ✓')};await refreshDailySent();await loadActivities(r.id);render()}catch(e){toast('Could not mark Sent: '+e.message,true);if(btn)btn.disabled=false}}
function replaceContact(r){const i=contacts.findIndex(x=>x.id===r.id);if(i>=0)contacts[i]=r}
async function saveLead(r){const d=drafts[r.id];if(!d)return;const patch={status:d.status||'Not contacted',notes:d.notes||'',follow_up:d.follow_up||'',next_action:d.next_action||''};try{const {data,error}=await sb.from('connections').update(patch).eq('id',r.id).eq('user_id',user.id).select(CONTACT_COLUMNS).single();if(error)throw error;const changedStatus=r.status!==data.status,changedNotes=(r.notes||'')!==(data.notes||'');replaceContact(data);if(changedStatus||changedNotes){const event_type=data.status==='Replied'&&changedStatus?'replied':changedNotes&&!changedStatus?'note':'status_change';const ev=await sb.from('crm_activities').insert({user_id:user.id,connection_id:r.id,event_type,details:changedStatus?`Status: ${r.status||'Not contacted'} → ${data.status}`:'Updated contact notes'});if(ev.error)toast('Saved details, activity log failed: '+ev.error.message,true)}toast('Contact details saved to Supabase ✓');await loadActivities(r.id);render()}catch(e){toast('Save failed: '+e.message,true)}}
async function saveTemplate(e){e.preventDefault();const f=new FormData(e.target);const row={name:String(f.get('name')||'').trim(),role_category:f.get('role_category')||null,industry:String(f.get('industry')||'').trim()||null,stage:f.get('stage'),priority:Number(f.get('priority')||0),is_active:f.get('is_active')==='true',body:String(f.get('body')||'').trim()};if(!row.name||!row.body)return toast('Template name and message required',true);if(row.priority<0||row.priority>100)return toast('Priority should be 0–100',true);const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{let data,error;if(templateEditId){({data,error}=await sb.from('crm_templates').update(row).eq('id',templateEditId).eq('user_id',user.id).select().single());if(error)throw error;templates=templates.map(t=>t.id===data.id?data:t)}else{({data,error}=await sb.from('crm_templates').insert({...row,user_id:user.id,template_key:'custom_'+Date.now()}).select().single());if(error)throw error;templates.push(data);templateEditId=data.id}toast('Template saved to Supabase ✓');render()}catch(err){btn.disabled=false;toast('Template save failed: '+err.message,true)}}
async function deleteTemplate(){const id=templateEditId;if(!id||!confirm('Delete this saved template? Sent message history stays intact.'))return;try{const {error}=await sb.from('crm_templates').delete().eq('id',id).eq('user_id',user.id);if(error)throw error;templates=templates.filter(t=>t.id!==id);templateEditId=null;toast('Template deleted');render()}catch(e){toast(e.message,true)}}
async function loadActivities(leadId){try{const {data,error}=await sb.from('crm_activities').select('id,event_type,details,message_snapshot,occurred_at').eq('connection_id',leadId).order('occurred_at',{ascending:false}).limit(30);if(error)throw error;if(selectedId!==leadId)return;activities=data||[];activitiesLeadId=leadId;render()}catch(e){activities=[];activitiesLeadId=leadId;toast('Activity history unavailable: '+e.message,true);render()}}
async function fetchContacts(){let all=[];for(let start=0;start<20000;start+=500){const {data,error}=await sb.from('connections').select(CONTACT_COLUMNS).eq('user_id',user.id).order('source_row_number',{ascending:true,nullsFirst:false}).range(start,start+499);if(error)throw error;all.push(...(data||[]));if((data||[]).length<500)break}return all}
async function refreshDailySent(){const d=new Date();d.setHours(0,0,0,0);const {count,error}=await sb.from('crm_activities').select('id',{count:'exact',head:true}).eq('event_type','sent').gte('occurred_at',d.toISOString());if(!error)dailySent=count||0}
async function loadData(force=false){if(loading)return;loading=true;try{const [all,tm,st]=await Promise.all([fetchContacts(),sb.from('crm_templates').select('*').order('priority',{ascending:false}),sb.from('crm_settings').select('*').eq('user_id',user.id).maybeSingle()]);if(tm.error)throw new Error('Templates table not ready: '+tm.error.message);if(st.error)throw new Error('Settings table not ready: '+st.error.message);contacts=all;templates=tm.data||[];settings=st.data||settings;await refreshDailySent();if(!contacts.some(x=>x.id===selectedId))selectedId=sorted(contacts)[0]?.id||null;if(force){drafts={};messages={};chosenTemplates={};toast('Data refreshed from Supabase')}render();if(selectedId&&(view==='outreach'||view==='leads'))loadActivities(selectedId)}catch(e){app.innerHTML=`<div class="card card-pad main-error"><h2>Could not load CRM</h2><p class="error">${esc(e.message)}</p><p>Check you ran the CRM setup SQL and assigned the imported contacts to this Auth user. Your contacts have not been deleted.</p><button class="button primary" id="retry">Retry</button> <button class="button" id="logout-error">Sign out</button></div>`;document.getElementById('retry').onclick=()=>loadData(true);document.getElementById('logout-error').onclick=async()=>{await sb.auth.signOut();user=null;renderLogin()}}finally{loading=false}}
function renderLogin(){app.innerHTML=`<div class="card center-card"><div class="logo" style="padding:0"><span class="logo-icon">GS</span><span><strong>GS Enterprises Digital</strong><small>PRIVATE OUTREACH CRM</small></span></div><h1>Unlock your CRM</h1><p>Sign in once on this browser. Your session is remembered; no repeated login screen while it remains valid.</p><form id="login-form"><div><label class="small-label">Your Supabase Auth email</label><input class="field wide" type="email" autocomplete="username" id="email" required></div><div><label class="small-label">Password</label><input class="field wide" type="password" autocomplete="current-password" id="password" required></div><button class="button primary" type="submit" id="login-btn">Sign in securely</button></form><p class="notice" style="margin-top:16px">Only your existing Supabase Auth account can access your private contacts. Do not paste a secret/service_role key into this website.</p></div>`;document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('login-btn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){toast(error.message,true);b.disabled=false;b.textContent='Sign in securely';return}user=data.user;await loadData()}}
function exportCsv(){const fields=['name','first_name','last_name','company','title','linkedin_url','email','industry','priority','score','status','notes','last_touch','follow_up','next_action'];const cells=contacts.map(r=>fields.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','));const csv='\ufeff'+fields.join(',')+'\r\n'+cells.join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='GS_Outreach_Contacts_'+dateLocal()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('CSV export downloaded')}
async function boot(){if(!window.supabase?.createClient){app.innerHTML='<div class="card card-pad main-error"><h2>Internet connection required</h2><p>Supabase library could not load. Connect to the internet, or host the HTML on HTTPS (GitHub Pages) and refresh.</p></div>';return}sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await sb.auth.getUser();if(error||!data?.user){renderLogin();return}user=data.user;await loadData()}
boot();
</script></body></html>
