 app.innerHTML=`<div class="login-screen"><div class="login-panel"><div class="site-brand"><div class="brand-emblem">GS</div><div><strong>GS ENTERPRISES DIGITAL</strong><div class="subtitle">RELATIONSHIP OUTREACH STUDIO · CLOUD</div></div></div><h1>Sign in to your connections</h1><p class="hint">Use the email and password you created under Supabase Authentication → Users. Your contacts are kept in Supabase and protected by RLS.</p><form id="login-form"><label class="field-label" for="login-email">Email</label><input class="field" id="login-email" type="email" autocomplete="username" required placeholder="you@example.com"><label class="field-label" for="login-password" style="margin-top:14px">Password</label><input class="field" id="login-password" type="password" autocomplete="current-password" required><div id="login-error" class="status-message" role="alert">${esc(error)}</div><button type="submit" class="button purple" id="login-submit">Sign in securely</button></form><p class="logo-note" style="margin-top:18px">Only your publishable key is in this HTML file. No contact data or secret key is embedded.</p></div></div>`;
 document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('login-submit');button.disabled=true;button.textContent='Signing in…';const email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-password').value;const {data,error}=await client.auth.signInWithPassword({email,password});if(error){document.getElementById('login-error').textContent=error.message;button.disabled=false;button.textContent='Sign in securely';return}await loadForUser(data.user)});
}
async function fetchAll() {
 const out=[];const limit=1000;
 for(let offset=0;offset<200000;offset+=limit){
  const {data,error}=await client.from('connections').select(COLS.join(',')).order('source_row_number',{ascending:true,nullsFirst:false}).range(offset,offset+limit-1);
  if(error)throw error;
  out.push(...(data||[]));
  if(!data||data.length<limit)break;
 }
 return out;
}
async function loadForUser(user){
 authUser=user;loading();
 try{records=await fetchAll();selectedId=records[0]?.id||null;filters={q:'',status:'All',priority:'All'};page=1;render()}
 catch(e){app.innerHTML=`<div class="shell"><div class="error-strip">Could not load records: ${esc(e.message)}. Please check the SQL setup, Supabase connection and RLS permissions.</div><button class="button purple" id="retry">Retry</button> <button class="button" id="logout-on-error">Sign out</button></div>`;document.getElementById('retry').onclick=()=>loadForUser(user);document.getElementById('logout-on-error').onclick=signOut}
}
function statusFamily(s){const v=String(s||'').toLowerCase();return /new|not contacted|research|draft ready/.test(v)?'new':/sent/.test(v)?'sent':/replied|conversation|introduced|interested|meeting|proposal|won/.test(v)?'active':'other'}
function recName(r){return r.name||[r.first_name,r.last_name].filter(Boolean).join(' ')||'(Name not available)'}
function filteredRecords(){const q=filters.q.trim().toLowerCase();return records.filter(r=>(filters.status==='All'||r.status===filters.status)&&(filters.priority==='All'||(r.priority||'None')===filters.priority)&&(!q||[r.name,r.company,r.title,r.email,r.linkedin_url,r.industry].some(v=>String(v||'').toLowerCase().includes(q))))}
function uniqueValues(k){return [...new Set(records.map(r=>String(r[k]||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function options(arr,selected){return arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function header(){return `<div class="top"><div class="top-inner"><div class="site-brand"><div class="brand-emblem">GS</div><div class="brand-text"><strong>GS Enterprises Digital</strong><span>SUPABASE RELATIONSHIP STUDIO</span></div></div><div class="logout-area"><span class="meta">${esc(authUser?.email||'')}</span><button type="button" class="button small" id="refresh">↻ Refresh</button><button type="button" class="button small" id="export">↓ Export CSV</button><button type="button" class="button small" id="signout">Sign out</button></div></div></div>`}
function metric(icon,count,label){return `<div class="mini-stat small-stat"><div class="stat-dot">${icon}</div><div><strong>${count.toLocaleString('en-IN')}</strong><small>${esc(label)}</small></div></div>`}
function listPanel(){
 const all=filteredRecords();const nPages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));page=Math.min(page,nPages);shown=all.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
 const statusValues=['All',...uniqueValues('status')],prioValues=['All',...uniqueValues('priority')];
 return `<section class="panel list-panel"><div class="list-header"><div><h2>Connections</h2><p>${all.length.toLocaleString('en-IN')} matching contacts</p></div><button type="button" class="button purple small" id="new-record">+ Add contact</button></div><div class="list-filters"><input class="field" id="search" type="search" placeholder="Search name, company, LinkedIn…" value="${esc(filters.q)}"><select class="field" style="min-width:100px" id="filter-status" aria-label="Filter status">${options(statusValues,filters.status)}</select><select class="field" style="min-width:85px" id="filter-priority" aria-label="Filter priority">${options(prioValues,filters.priority)}</select></div><div class="contacts-list">${shown.length?shown.map(r=>`<button type="button" class="record-button ${selectedId===r.id?'active':''}" data-id="${esc(r.id)}"><span class="avatar">${esc(initials(recName(r)))}</span><span class="rbody"><strong>${esc(recName(r))}</strong><small>${esc(truncate([r.title,r.company].filter(Boolean).join(' · '),65))}</small></span><span class="status">${esc(truncate(r.status||'Not contacted',15))}</span></button>`).join(''):'<div class="empty-note">No matching records</div>'}</div><div class="pagination"><button type="button" class="button small" id="prev" ${page<=1?'disabled':''}>← Previous</button><span>Page ${page} of ${nPages}</span><button type="button" class="button small" id="next" ${page>=nPages?'disabled':''}>Next →</button></div></section>`
}
const textField=(name,label,value,full=false,readonly=false,type='text')=>`<div class="field-box ${full?'full':''}"><label for="field-${name}">${esc(label)}</label><input id="field-${name}" name="${esc(name)}" type="${type}" value="${esc(value??'')}" ${readonly?'readonly':''}></div>`;
const textarea=(name,label,value)=>`<div class="field-box full"><label for="field-${name}">${esc(label)}</label><textarea id="field-${name}" name="${esc(name)}">${esc(value??'')}</textarea></div>`;
function recordPanel(){
 const r=records.find(x=>x.id===selectedId);
 if(!r) return `<div class="panel panel-pad right-panel"><div class="empty-note"><h2>No contact selected</h2><p>Choose someone from the list or add a new record.</p></div></div>`;
 const extraStatuses=[...new Set([...STATUSES,...uniqueValues('status'),r.status||'Not contacted'])];
 const extraPriorities=[...new Set(['', 'A','B','C','V',...uniqueValues('priority')])];
 const link=safeUrl(r.linkedin_url);
 return `<section class="panel panel-pad right-panel"><div class="row split"><div class="person-top" style="margin:0"><div class="avatar">${esc(initials(recName(r)))}</div><div><h3>${esc(recName(r))}</h3><p>${esc(r.company||'Company not listed')}</p></div></div>${link?`<a class="button small" href="${esc(link)}" target="_blank" rel="noopener noreferrer">↗ LinkedIn</a>`:''}</div><div class="detail-divider"></div><form id="record-form"><div class="section-head">Contact details</div><div class="field-row">${textField('name','Full name',r.name)}${textField('company','Company',r.company)}${textField('title','Designation',r.title)}${textField('email','Email',r.email,false,false,'email')}${textField('linkedin_url','LinkedIn profile URL',r.linkedin_url,true)}${textField('first_name','First name',r.first_name)}${textField('last_name','Last name',r.last_name)}${textField('industry','Industry',r.industry)}${textField('segment','Segment',r.segment)}${textField('pathway','Pathway',r.pathway)}</div><div class="section-head">Outreach management</div><div class="field-row"><div class="field-box"><label for="field-status">Status</label><select id="field-status" name="status">${options(extraStatuses,r.status||'Not contacted')}</select></div><div class="field-box"><label for="field-priority">Priority</label><select id="field-priority" name="priority">${options(extraPriorities,r.priority||'')}</select></div>${textField('score','Lead score',r.score,false,false,'number')}${textField('confidence','Confidence',r.confidence)}${textField('last_touch','Last contact / touch',r.last_touch)}${textField('follow_up','Follow-up date',r.follow_up,false,false,'date')}${textField('next_action','Next action',r.next_action,true)}${textarea('notes','Notes',r.notes)}${textarea('reason','Lead fit reason',r.reason)}${textarea('angle','Suggested approach',r.angle)}</div><div class="section-head">Source and connection information</div><div class="field-row">${textField('connected_on','Connected on',r.connected_on,false,false,'date')}${textField('connected_original','Original connection date',r.connected_original)}${textField('rank','Original rank',r.rank,false,false,'number')}${textField('source_record_id','Legacy source ID',r.source_record_id)}${textField('record_quality','Record quality',r.record_quality)}${textField('source_row_number','CSV source row number',r.source_row_number,false,false,'number')}${textField('source_key','Source key',r.source_key,true,true)}</div><div class="selection-actions"><button type="submit" class="button purple" id="save-record">Save to Supabase</button><button type="button" class="button" id="reset-record">Discard changes</button></div><div class="hint">Changes are written directly to <strong>public.connections</strong> when you press Save. Only authenticated users with row-level access can view or edit them.</div><div id="save-result" class="status-message" aria-live="polite"></div></form></section>`
}
function render(){
 const counts={total:records.length,new:records.filter(x=>statusFamily(x.status)==='new').length,sent:records.filter(x=>statusFamily(x.status)==='sent').length,active:records.filter(x=>statusFamily(x.status)==='active').length};
 app.innerHTML=header()+`<main class="shell"><div class="page-intro"><div><div class="section-kicker">CLOUD OUTREACH WORKSPACE</div><h1>Your connections.<br><em>One place.</em></h1><p>Search, segment, and manage LinkedIn relationships. All records load from Supabase, not from an HTML-embedded contact list.</p></div><div class="safety-pill">🔒 Auth + RLS</div></div><div class="health-line"><span class="dot"></span><strong>Connected to Supabase</strong> <span>·</span> <span>${esc(authUser?.email||'')}</span></div>${records.length===0?`<div class="error-strip"><strong>No contacts visible.</strong> This login has no rows that satisfy its RLS policy. In Supabase SQL Editor, check whether the imported 2,021 records have <code>user_id</code> set to your Authentication User UID. Do not disable RLS.</div>`:''}<div class="summary">${metric('👥',counts.total,'Total contacts')}${metric('✨',counts.new,'Not yet contacted')}${metric('✉',counts.sent,'Sent / awaiting reply')}${metric('💬',counts.active,'Active conversations')}</div><div class="dashboard-grid">${listPanel()}${recordPanel()}</div><p class="footer">GS Enterprises Digital · Cloud Relationship Studio · Private by Supabase RLS</p></main>`;
 bindControls();
}
function bindControls(){
 document.getElementById('refresh').onclick=()=>loadForUser(authUser);
 document.getElementById('signout').onclick=signOut;
 document.getElementById('export').onclick=exportCSV;
 document.getElementById('new-record').onclick=addRecord;
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;render()});
 const search=document.getElementById('search');
 search.addEventListener('input',()=>{const focusAt=search.selectionStart;filters.q=search.value;page=1;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(focusAt,focusAt)});
 document.getElementById('filter-status').onchange=e=>{filters.status=e.target.value;page=1;render()};
 document.getElementById('filter-priority').onchange=e=>{filters.priority=e.target.value;page=1;render()};
 document.getElementById('prev').onclick=()=>{page=Math.max(1,page-1);render()};
 document.getElementById('next').onclick=()=>{page++;render()};
 document.getElementById('record-form')?.addEventListener('submit',saveRecord);
 document.getElementById('reset-record')?.addEventListener('click',render);
}
async function saveRecord(e){
 e.preventDefault();const btn=document.getElementById('save-record');btn.disabled=true;btn.textContent='Saving…';
 const form=new FormData(e.currentTarget), updates={};
 const existing=records.find(r=>r.id===selectedId);
 const editable=COLS.filter(c=>!['id','user_id','source_key'].includes(c));
 for(const k of editable){
  const v=form.get(k);if(v===null)continue;
  const was=String(existing?.[k]??'');
  if(String(v)===was)continue; // preserve untouched nulls, dates, and imported values
  if(['source_row_number','rank','score'].includes(k))updates[k]=v.trim()===''?null:Number(v);
  else if(k==='connected_on')updates[k]=v||null;
  else updates[k]=String(v||'');
 }
 if(!Object.keys(updates).length){btn.disabled=false;btn.textContent='Save to Supabase';toast('No changes to save');return}
 try{const {data,error}=await client.from('connections').update(updates).eq('id',selectedId).select(COLS.join(',')).single();if(error)throw error;const idx=records.findIndex(r=>r.id===selectedId);if(idx>=0)records[idx]=data;render();toast('Contact saved successfully in Supabase');document.getElementById('save-result').textContent='Saved in Supabase ✓';document.getElementById('save-result').classList.add('ok')}
 catch(err){const t=document.getElementById('save-result');if(t)t.textContent='Save failed: '+err.message;toast('Save failed: '+err.message,true);btn.disabled=false;btn.textContent='Save to Supabase'}
}
async function addRecord(){
 const name=prompt('New contact full name');if(!name?.trim())return;
 const company=prompt('Company (optional)')||'';
 const linkedin_url=prompt('LinkedIn profile URL (optional)')||'';
 if(linkedin_url && !safeUrl(linkedin_url)){toast('Please enter a valid http/https LinkedIn URL',true);return}
 const key='manual:'+Date.now().toString(36)+Math.random().toString(36).slice(2);
 const row={source_key:key,user_id:authUser.id,name:name.trim(),company:company.trim(),linkedin_url:linkedin_url.trim(),status:'Not contacted',priority:'B',source_row_number:Math.max(0,...records.map(r=>Number(r.source_row_number)||0))+1,record_quality:'manual_entry'};
 const {data,error}=await client.from('connections').insert(row).select(COLS.join(',')).single();if(error){toast('Could not add contact: '+error.message,true);return}
 records.push(data);selectedId=data.id;filters={q:'',status:'All',priority:'All'};page=1;render();toast('New contact added to Supabase')
}
function exportCSV(){
 const cols=COLS.filter(c=>c!=='user_id');const csv=[cols.join(',')];
 for(const row of records){csv.push(cols.map(k=>{let v=String(row[k]??'');if(/^[\s]*[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(','))}
 const blob=new Blob(['\uFEFF'+csv.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GS_Supabase_Connections_'+dateToday()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast(records.length+' contacts exported to CSV')
}
async function signOut(){const {error}=await client.auth.signOut();if(error){toast('Sign out failed: '+error.message,true);return}login()}
async function boot(){
 if(!window.supabase?.createClient){app.innerHTML='<div class="shell"><div class="error-strip">Supabase JavaScript library did not load. Please connect to the internet and refresh this page.</div></div>';return}
 client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await client.auth.getUser();
 if(!error&&data?.user)await loadForUser(data.user);else login();
}
boot();

</script></body></html>
