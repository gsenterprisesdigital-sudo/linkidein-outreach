<script>
'use strict';
const seed=JSON.parse(document.getElementById('seed-data').textContent);
const KEY='gsdigital_outreach_studio_v1';
const statuses=['Not contacted','Research','Draft ready','Sent','Replied','Interested','Meeting booked','Proposal sent','Won','Lost','Not fit'];
const pLabels={A:'High potential',B:'Medium potential',C:'Referral / research',V:'Needs verification'};
const priorityOrder={A:4,B:3,C:2,V:1};
const e=(v)=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const icon=(name)=>`<svg aria-hidden="true"><use href="#ic-${name}"></use></svg>`;
const storageDefaults=()=>({overrides:{},custom:[],events:[],settings:{sender:'GS Enterprises Digital',services:'Creative content, social media marketing, brand strategy, websites, performance marketing and SEO',website:'https://gsenterprisesdigital-sudo.github.io/TESTING/services.html',includeWebsite:false,followupDays:3,dailyGoal:20}});
let store=storageDefaults(),canSave=true;
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);store={...store,...parsed,settings:{...store.settings,...(parsed.settings||{})}}}}catch(ex){canSave=false;}
const ui={view:'studio',search:'',priority:'all',status:'all',industry:'all',sort:'priority',page:1,detail:null,menu:false,skipped:[],lastSent:null,lastImport:null,importedIds:[]};
const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(n||0));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const displayDate=(d)=>{if(!d)return '—';let dt=new Date(d.length===10?d+'T12:00:00':d);return isNaN(dt)?d:dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:dt.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};
const safeLink=(str)=>/^https?:\/\//i.test(String(str||''))?String(str):'';
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));canSave=true}catch(ex){canSave=false;toast('Browser cannot save locally. Export a JSON backup to protect your work.')}};
const all=()=>[...seed,...store.custom].map(p=>({...p,...(store.overrides[p.id]||{})}));
const getLead=(id)=>{const p=seed.find(x=>x.id===id)||store.custom.find(x=>x.id===id);return p?{...p,...(store.overrides[id]||{})}:null};
const patch=(id,data,label,log=true)=>{store.overrides[id]={...(store.overrides[id]||{}),...data};if(log&&label){store.events.unshift({id:'ev'+Date.now()+Math.random().toString(36).slice(2,7),leadId:id,label,time:new Date().toISOString()});store.events=store.events.slice(0,3000)}persist();};
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3400)}
const initials=name=>String(name||'?').trim().split(/\s+/).slice(0,2).map(t=>t[0]?.toUpperCase()||'').join('')||'?';
const avClass=id=>['','blue','orange','violet'][Number(String(id).replace(/\D/g,'').slice(-2)||0)%4];
const avatar=p=>`<span class="avatar ${avClass(p.id)}">${e(initials(p.name))}</span>`;
const priorityBadge=p=>`<span class="badge ${p.priority==='V'?'v':p.priority.toLowerCase()}">${e(pLabels[p.priority]||p.priority)}</span>`;
const statusBadge=p=>`<span class="badge ${p.status==='Won'?'won':p.status==='Lost'||p.status==='Not fit'?'lost':p.status==='Replied'||p.status==='Interested'?'replied':'s'}">${e(p.status||'Not contacted')}</span>`;
const isContacted=p=>!['Not contacted','Research','Draft ready','Not fit'].includes(p.status||'Not contacted');
const isDue=p=>Boolean(p.followUp&&p.followUp<=day()&&!['Won','Lost','Not fit'].includes(p.status));
const dueSoon=p=>Boolean(p.followUp&&p.followUp<=addDays(day(),7)&&!['Won','Lost','Not fit'].includes(p.status));
const isActive=p=>!['Won','Lost','Not fit'].includes(p.status);
const lastStamp=p=>p.lastTouch||'';
function stats(){let a=all();let sentToday=new Set(store.events.filter(x=>x.time?.slice(0,10)===day()&&/^(Message sent|Outreach message marked sent|Follow-up message sent)/i.test(x.label||'')).map(x=>x.leadId)).size;return{total:a.length,high:a.filter(x=>x.priority==='A').length,contacted:a.filter(isContacted).length,ready:a.filter(p=>!isContacted(p)&&isActive(p)).length,due:a.filter(isDue).length,soon:a.filter(dueSoon).length,replied:a.filter(x=>['Replied','Interested','Meeting booked','Proposal sent','Won'].includes(x.status)).length,won:a.filter(x=>x.status==='Won').length,sentToday,active:a.filter(isActive).length}}

function header(){return `<header class="topbar"><div class="top-quick"><button class="iconbtn mobilemenu" aria-label="Open menu" data-action="menu">${icon('menu')}</button><span class="crumb"><span class="crumb-star">✳</span> GS ENTERPRISES DIGITAL <span class="crumb-slash"> / </span> <strong>${e(labelForView())}</strong></span></div><div class="top-actions"><span class="online"><i class="dot"></i> ${canSave?'Saved on this device':'Backup recommended'}</span><button class="button backup-button" data-action="export-json">${icon('download')} Backup</button><button class="button header-import" data-action="import">${icon('upload')} Import CSV</button><button class="button primary add-button" data-action="add">${icon('plus')} Add contact</button><button class="iconbtn mobilemenu" data-action="import" aria-label="Import CSV">${icon('upload')}</button></div></header>`}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">✳ CREATIVE OUTREACH / GS ENTERPRISES DIGITAL</div><h2>${title}</h2><p>${sub}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`}
function statCard(label,value,ic,foot,view){return `<button class="stat" data-nav="${view}"><div class="stat-h"><span>${label}</span><span class="stat-icon">${icon(ic)}</span></div><strong>${Number(value).toLocaleString('en-IN')}</strong><div class="stat-foot">${foot}</div></button>`}
function compactLead(p,end='score'){return `<button class="prospect" data-open="${e(p.id)}">${avatar(p)}<span class="prospect-body"><b>${e(p.name||'Unnamed prospect')}</b><small>${e(p.title||'Role unverified')} · ${e(p.company||'Company unverified')}</small></span><span class="prospect-end">${end==='score'?`<span class="score">${p.score}/100</span><span class="tiny">${e(pLabels[p.priority]||'')}</span>`:end==='date'?`<span class="tiny">${displayDate(p.lastTouch)}</span>${statusBadge(p)}`:`<span class="tiny">${displayDate(p.followUp)}</span>${statusBadge(p)}`}</span>${icon('chevron')}</button>`}
function shortlist(n=5){return all().filter(p=>p.priority==='A'&&!isContacted(p)&&isActive(p)).sort((a,b)=>(b.score||0)-(a.score||0)||a.rank-b.rank).slice(0,n)}
function dashboard(){let a=all(),s=stats(),recents=a.filter(p=>p.lastTouch).sort((x,y)=>y.lastTouch.localeCompare(x.lastTouch)||((store.events.find(t=>t.leadId===y.id)?.time||'').localeCompare(store.events.find(t=>t.leadId===x.id)?.time||''))).slice(0,4),due=a.filter(isDue).sort((x,y)=>x.followUp.localeCompare(y.followUp)).slice(0,4),hot=shortlist(5);let n=s.total||1;let sections=[['High potential',s.high,'#20aa87'],['Medium potential',a.filter(x=>x.priority==='B').length,'#879ce1'],['Referral / research',a.filter(x=>x.priority==='C').length,'#c0cbd7'],['Needs verification',a.filter(x=>x.priority==='V').length,'#e9bb76']];return `${heading('Your outreach cockpit','Your contacts, conversations, follow-ups and progress in one place.',`<button class="button" data-nav="recent">${icon('activity')} Recent activity</button><button class="button primary" data-action="start">${icon('send')} Go to outreach desk</button>`)}<div class="cards">${statCard('Total prospects',s.total,'users','Ranked lead database','all')}${statCard('High potential',s.high,'target','Top priority to approach','queue')}${statCard('Contacted',s.contacted,'send',`${s.replied} positive responses / progressed`,'recent')}${statCard('Follow-ups due',s.due,'clock',`${s.soon} scheduled within 7 days`,'followups')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><div><h3>${icon('bolt')} Next best prospects</h3><p>Uncontacted high-potential leads, ranked by fit</p></div><button class="text-link" data-nav="queue">View queue ${icon('chevron')}</button></div><div class="prospect-list">${hot.length?hot.map(p=>compactLead(p)).join(''):'<div class="empty">All high-potential leads are already contacted — excellent progress.</div>'}</div></section><section class="panel"><div class="panel-title"><div><h3>Lead quality distribution</h3><p>Priority categories from your source CSV</p></div></div><div class="pipeline"><div class="pipeline-track">${sections.map(q=>`<span style="width:${q[1]/n*1 low-up sent today</button><button class="button" data-action="meeting" data-id="${e(p.id)}">${icon('calendar')} Meeting booked</button><button class="button" data-action="won" data-id="${e(p.id)}">${icon('award')} Mark won</button></div><div class="timeline">${ev.length?ev.map(v=>`<div class="event"><span class="event-dot">${icon('check')}</span><div><b>${e(v.label)}</b><small>${new Date(v.time).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</small></div></div>`).join(''):'<div class="empty" style="padding:20px">No activities yet. Your actions will appear here.</div>'}</div></div></div></aside>`}

function download(filename,data,type){let blob=new Blob([data],{type});let href=URL.createObjectURL(blob);let a=document.createElement('a');a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1200)}

function parseCSV(text){
 text=String(text||'').replace(/^\uFEFF/,'');
 let firstLine=text.split(/\r?\n/,1)[0]||'', delimiters=[',',';','\t'];
 let delimiter=delimiters.map(d=>({d,n:firstLine.split(d).length-1})).sort((a,b)=>b.n-a.n)[0].d;
 let records=[],row=[],val='',quoted=false;
 for(let i=0;i<text.length;i++){
   const c=text[i];
   if(quoted){if(c==='"'&&text[i+1]==='"'){val+='"';i++}else if(c==='"')quoted=false;else val+=c;continue}
   if(c==='"'&&val===''){quoted=true;continue}
   if(c===delimiter){row.push(val);val='';continue}
   if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(val);if(row.some(x=>x.trim()))records.push(row);row=[];val='';continue}
   val+=c;
 }
 if(quoted)throw Error('CSV contains an unclosed quoted field');
 if(val||row.length){row.push(val);if(row.some(x=>x.trim()))records.push(row)}
 if(records.length<2)throw Error('CSV needs a header row and at least one contact');
 const header=records.shift().map(h=>h.replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim());
 if(header.every(x=>!x))throw Error('CSV header is missing');
 return records.map(cols=>Object.fromEntries(header.map((h,i)=>[h,String(cols[i]??'').trim()])));
}
const normalizeProfile=s=>String(s||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\?.*$/,'').replace(/\/+$/,'');
const normalizeWord=s=>String(s||'').normalize('NFKC').toLowerCase().trim().replace(/\s+/g,' ');
const csvGet=(r,...keys)=>{for(const k of keys){let v=r[k.replace(/[^a-z0-9]+/gi,' ').toLowerCase().trim()];if(v)return v.trim()}return ''};
async function importFile(file){
 const text=await file.text();
 if(file.name.toLowerCase().endsWith('.json')){
  let data=JSON.parse(text);
  if(data.format!=='gs_outreach_v1'||!data.store||typeof data.store!=='object')throw Error('Not a valid GS Outreach Studio backup');
  if(!confirm('Restore this JSON backup? It will replace current statuses, notes and activity history on this device.'))return;
  store={...storageDefaults(),...data.store,settings:{...storageDefaults().settings,...(data.store.settings||{})}};
  persist();ui.lastImport=null;ui.importedIds=[];toast('Backup restored successfully');switchView('studio');return;
 }
 if(!/\.(csv|tsv|txt)$/i.test(file.name))throw Error('Please upload a CSV (or a JSON backup)');
 const rows=parseCSV(text);
 const lookup=new Map(),byMail=new Map(),byNameCompany=new Map();
 for(const p of all()){
  if(p.url)lookup.set(normalizeProfile(p.url),p);
  if(p.email)byMail.set(normalizeWord(p.email),p);
  if(p.name&&p.company)byNameCompany.set(normalizeWord(p.name)+'|'+normalizeWord(p.company),p);
 }
 let added=0,duplicates=0,invalid=0,seenRowKeys=new Set(),addedIds=[];
 for(const r of rows){
  const name=csvGet(r,'name','full name','contact name')||[csvGet(r,'first name','firstname'),csvGet(r,'last name','lastname')].filter(Boolean).join(' ').trim();
  const company=csvGet(r,'company','company name','organization','organisation','current company','account name');
  let url=csvGet(r,'linkedin url','linkedin profile','linkedin profile url','profile url','linkedin','url','public profile url').trim();
  let email=csvGet(r,'email','email address','e mail','email export only');
  if(!name){invalid++;continue}
  if(url&&!/^https?:\/\//i.test(url))url=/^(www\.)?linkedin\.com\//i.test(url)?'https://'+url.replace(/^www\./i,'www.'):'';
  if(url&&!/^https?:\/\//i.test(url))url='';
  const profileKey=url?normalizeProfile(url):'',emailKey=email?normalizeWord(email):'',nameKey=company?normalizeWord(name)+'|'+normalizeWord(company):'';
  const rowKey=profileKey?`u:${profileKey}`:emailKey?`e:${emailKey}`:nameKey?`n:${nameKey}`:'';
  if((profileKey&&lookup.has(profileKey))||(emailKey&&byMail.has(emailKey))||(nameKey&&byNameCompany.has(nameKey))||(rowKey&&seenRowKeys.has(rowKey))){duplicates++;continue}
  if(rowKey)seenRowKeys.add(rowKey);
  const priorityRaw=csvGet(r,'priority','lead priority');
  const priority=/^(a|high)\b/i.test(priorityRaw)?'A':/^(b|medium)\b/i.test(priorityRaw)?'B':/^(c|referral)\b/i.test(priorityRaw)?'C':/^(v|verify|needs)\b/i.test(priorityRaw)?'V':'B';
  const rawScore=Number(csvGet(r,'fit score','score')||75),score=Number.isFinite(rawScore)?Math.max(0,Math.min(100,rawScore)):75;
  const industry=csvGet(r,'industry inferred','industry','sector')||'Unclassified';
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const st=csvGet(r,'outreach status','status');
  const np={id,rank:seed.length+store.custom.length+1,name,company,title:csvGet(r,'designation','title','position','job title','headline'),segment:csvGet(r,'role segment')||'Imported contact',pathway:csvGet(r,'lead pathway')||'Direct buyer / review',industry,priority,score,confidence:csvGet(r,'confidence')||'Unverified',reason:csvGet(r,'why selected')||'',angle:csvGet(r,'suggested outreach angle')||'',url,email,connected:csvGet(r,'connected on')||'',status:statuses.includes(st)?st:'Not contacted',lastTouch:csvGet(r,'last touch')||'',followUp:csvGet(r,'next follow up','follow up')||'',nextAction:csvGet(r,'next action')||'',notes:csvGet(r,'notes')||''};
  store.custom.push(np);addedIds.push(id);added++;
  if(profileKey)lookup.set(profileKey,np);if(emailKey)byMail.set(emailKey,np);if(nameKey)byNameCompany.set(nameKey,np);
 }
 persist();ui.lastImport={added,duplicates,invalid};ui.importedIds=addedIds;
 if(addedIds.length){ui.skipped=ui.skipped.filter(id=>!addedIds.includes(id))}
 ui.detail=null;ui.view='studio';ui.menu=false;render();window.scrollTo(0,0);
 toast(`CSV complete: ${added} added, ${duplicates} duplicates skipped, ${invalid} incomplete rows`);
}

function openNext(){let q=rankedUnsent();let target=q.find(p=>p.id!==ui.detail)||q[0]||all().find(isDue);if(!target){toast('No more pending leads. Check your follow-ups or All prospects.');return}ui.detail=target.id;render()}
function saveSettings(){let sender=document.getElementById('sender')?.value.trim();let services=document.getElementById('services')?.value.trim();let website=document.getElementById('website')?.value.trim()||'';let includeWebsite=Boolean(document.getElementById('includeWebsite')?.checked);let follow=Math.max(1,Math.min(90,parseInt(document.getElementById('followupDays')?.value||'3')||3));let goal=Math.max(1,Math.min(1000,parseInt(document.getElementById('dailyGoal')?.value||'20')||20));if(!sender||!services){toast('Please enter sender name and services');return}if(website&&!/^https?:\/\/[^\s.]+\.[^\s]+/i.test(website)){toast('Enter a valid website URL (https://...)');return}store.settings={...store.settings,sender,services,website,includeWebsite,followupDays:follow,dailyGoal:goal};persist();toast('Outreach settings saved');render()}
document.addEventListener('click',async(event)=>{
 const nav=event.target.closest('[data-nav]');if(nav){switchView(nav.dataset.nav);return}
 const tone=event.target.closest('[data-tone]');if(tone){const id=tone.dataset.id;patch(id,{draftTone:tone.dataset.tone,customMessage:buildMessage(getLead(id),tone.dataset.tone)},null,false);render();return}
 const open=event.target.closest('[data-open]');if(open){ui.detail=open.dataset.open;render();return}
 const page=event.target.closest('[data-page]');if(page){ui.page=Number(page.dataset.page);refreshList();return}
 const action=event.target.closest('[data-action]');if(!action)return;
 switch(action.dataset.action){
 case 'menu':ui.menu=!ui.menu;render();break;
 case 'close':ui.detail=null;render();break;
 case 'start':switchView('studio');break;
 case 'next':openNext();break;
 case 'add':ui.detail='new';render();break;
 case 'export-csv':exportCSV();break;
 case 'export-json':backupJSON();break;
 case 'import':document.getElementById('import-file').click();break;
 case 'template':downloadTemplate();break;
 case 'dismiss-import':ui.lastImport=null;render();break;
 case 'save-settings':saveSettings();break;
 case 'send-next':confirmSent(action.dataset.id,false);break;
 case 'mark-sent':confirmSent(action.dataset.id,true);break;
 case 'undo-sent':undoSent();break;
 case 'skip':{let p=studioNext();if(p){ui.skipped.push(p.id);render();moveToNextContact();toast(`${p.name} skipped for now, not marked sent.`)}break}
 case 'reset-skips':ui.skipped=[];render();break;
 case 'copy-studio':{let p=studioNext();if(!p)return;saveLiveDraft(p.id);try{await copyText(document.getElementById('studio-editor')?.value||studioMessage(getLead(p.id)));toast('Copied! Send it on LinkedIn or email. Then confirm Sent & next.')}catch(ex){toast('Could not copy. Select the message and copy manually.')}break}
 case 'reset-studio':{let id=action.dataset.id,p=getLead(id);patch(id,{customMessage:buildMessage(p,p.draftTone||'warm')},null,false);render();toast('Fresh personalised message generated');break}
 case 'reply':statusChange(action.dataset.id,'Replied','Reply received');toast('Reply recorded');break;
 case 'meeting':statusChange(action.dataset.id,'Meeting booked','Meeting booked');toast('Meeting booked recorded');break;
 case 'won':statusChange(action.dataset.id,'Won','Deal marked won');toast('Lead marked Won');break;
 case 'followup-sent':{let id=action.dataset.id;patch(id,{lastTouch:day(),followUp:addDays(day(),store.settings.followupDays),status:getLead(id).status==='Not contacted'?'Sent':getLead(id).status},'Follow-up message sent');render();toast('Follow-up recorded and next date scheduled');break}
 case 'copy-message':{let t=document.getElementById('message-editor')?.value||'';try{await copyText(t);toast('Message copied. Send it manually on LinkedIn or email.')}catch(ex){toast('Copy not supported. Select the draft and copy it manually.')}break}
 case 'reset-message':{let id=ui.detail,p=getLead(id),draft=buildMessage(p,p.draftTone||'warm');patch(id,{customMessage:draft},null,false);document.getElementById('message-editor').value=draft;toast('Personalised message regenerated');break}
 }
});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='search'){ui.search=t.value;ui.page=1;refreshList()}if(t.id==='studio-editor'&&t.dataset.draftId){store.overrides[t.dataset.draftId]={...(store.overrides[t.dataset.draftId]||{}),customMessage:t.value};persist()}});
document.addEventListener('change',event=>{let t=event.target;if(t.id==='priority'||t.id==='status'||t.id==='industry'||t.id==='sort'){ui[t.id]=t.value;ui.page=1;refreshList();return}if(t.id==='message-editor'){let id=ui.detail;if(id&&id!=='new')patch(id,{customMessage:t.value},null,false);return}if(t.dataset.field){let id=t.dataset.id,field=t.dataset.field,value=t.value;if(field==='status'&&value==='Sent'&&isUnsent(getLead(id))){confirmSent(id,true);return}let update={[field]:value};if(field==='status'){if(value==='Sent'&&!getLead(id).followUp)update.followUp=addDays(day(),store.settings.followupDays);if(!['Not contacted','Research','Draft ready','Not fit'].includes(value))update.lastTouch=day();if(['Won','Lost','Not fit'].includes(value))update.followUp=''}patch(id,update,field==='notes'||field==='nextAction'||field==='lastTouch'?null:`${field==='status'?'Status':field==='priority'?'Priority':field==='followUp'?'Follow-up date':field} updated${field==='status'?' to '+value:''}`,field!=='notes'&&field!=='nextAction'&&field!=='lastTouch');render();toast(field==='notes'?'Notes saved':'Lead updated')}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='add-form')return;ev.preventDefault();let form=new FormData(ev.target),name=String(form.get('name')||'').trim();if(!name)return;let url=String(form.get('url')||'').trim();if(url&&all().some(p=>p.url===url)){toast('A lead with this LinkedIn URL already exists');return}let id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);let p={id,rank:seed.length+store.custom.length+1,name,company:String(form.get('company')||''),title:String(form.get('title')||''),segment:'Manually added',pathway:'Direct buyer / review',industry:String(form.get('industry')||'')||'Unclassified',priority:String(form.get('priority')||'A'),score:Math.max(0,Math.min(100,Number(form.get('score')||75))),confidence:'Unverified',reason:String(form.get('reason')||''),angle:'Explore digital visibility and qualified lead generation',url,email:String(form.get('email')||''),connected:'',status:'Not contacted',lastTouch:'',followUp:'',notes:'',nextAction:''};store.custom.push(p);persist();ui.view='all';ui.detail=id;ui.search='';ui.priority='all';ui.status='all';ui.industry='all';render();toast('New lead added')});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.detail){ui.detail=null;render()}if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-open]')){ev.preventDefault();ui.detail=ev.target.dataset.open;render()}});
document.getElementById('import-file').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{await importFile(f)}catch(ex){toast('Import failed: '+ex.message)}ev.target.value=''});
render();
</script></body></html>
