<script>
(()=>{'use strict';
const seed=JSON.parse(document.getElementById('seed-data').textContent);
const K='gsdigital_relationship_studio_v2',OLD='gsdigital_outreach_studio_v1';
const defaults=()=>({overrides:{},custom:[],history:[],settings:{sender:'GS Enterprises Digital',followDays:6,website:'https://gsenterprisesdigital-sudo.github.io/TESTING/services.html'}});
const STATUS={new:'New',sent:'Friendly sent',replied:'Replied',chat:'Conversation',intro:'Business introduced',interested:'Interested',closed:'Closed'};
const normalize=s=>String(s||'').normalize('NFKC').toLowerCase().trim().replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datestr=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const addDays=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+Number(n||0));return datestr(d)};
const today=()=>datestr();
const first=p=>String(p.name||'there').replace(/^(dr\.?|ca|mr\.?|ms\.?|mrs\.?)\s+/i,'').split(/\s+/)[0]||'there';
const safeURL=s=>/^https:\/\//i.test(String(s||''))?String(s):'';
const init=p=>String(p.name||'?').split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');
const randomId=()=>('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function fromOldStatus(s){const v=normalize(s);if(['not contacted','research','draft ready','new'].includes(v))return STATUS.new;if(['sent','friendly sent'].includes(v))return STATUS.sent;if(v==='replied')return STATUS.replied;if(v==='interested'||v==='meeting booked'||v==='proposal sent'||v==='won')return STATUS.interested;if(['lost','not fit','closed'].includes(v))return STATUS.closed;return STATUS.new}
function load(){let d=defaults();try{const stored=localStorage.getItem(K);if(stored){const p=JSON.parse(stored);return {...d,...p,settings:{...d.settings,...p.settings}};}const old=localStorage.getItem(OLD);if(old){let p=JSON.parse(old);d.custom=(p.custom||[]).map(q=>({...q,status:fromOldStatus(q.status)}));d.overrides=Object.fromEntries(Object.entries(p.overrides||{}).map(([id,v])=>[id,{...v,status:v.status?fromOldStatus(v.status):undefined,previousStatus:v.status||''}]));d.history=(p.events||[]).slice(0,3000);d.settings={...d.settings,...(p.settings||{})};localStorage.setItem(K,JSON.stringify(d));}return d}catch(err){return d}}
let db=load(),saveOk=true;
const ui={tab:'new',selected:null,skip:new Set(),tone:'friendly',search:'',page:1,flash:'',lastChange:null};
const app=document.getElementById('app');
function save(){try{localStorage.setItem(K,JSON.stringify(db));saveOk=true}catch(err){saveOk=false;toast('Browser save failed. Download a JSON backup.')}}
function all(){return [...seed,...db.custom].map(p=>({...p,...db.overrides[p.id],status:db.overrides[p.id]?.status||p.status&&fromOldStatus(p.status)||STATUS.new}));}
function lead(id){const p=seed.find(p=>p.id===id)||db.custom.find(p=>p.id===id);return p?{...p,...db.overrides[id],status:db.overrides[id]?.status||p.status&&fromOldStatus(p.status)||STATUS.new}:null}
function patch(id,delta,verb){db.overrides[id]={...(db.overrides[id]||{}),...delta};if(verb){db.history.unshift({id:randomId(),leadId:id,label:verb,date:new Date().toISOString()});db.history=db.history.slice(0,3000)}save()}

function sorted(rows){return rows.sort((a,b)=>({A:0,B:1,C:2,V:3}[a.priority]??4)-({A:0,B:1,C:2,V:3}[b.priority]??4)||(Number(b.score)||0)-(Number(a.score)||0)||(Number(a.rank)||999999)-(Number(b.rank)||999999));}
function inbox(tab){const rows=all();if(tab==='new')return sorted(rows.filter(p=>p.status===STATUS.new));if(tab==='sent')return sorted(rows.filter(p=>p.status===STATUS.sent));if(tab==='chats')return sorted(rows.filter(p=>[STATUS.replied,STATUS.chat,STATUS.intro,STATUS.interested].includes(p.status)));if(tab==='due')return rows.filter(p=>p.followUp&&p.followUp<=today()&&[STATUS.sent,STATUS.replied,STATUS.chat,STATUS.intro].includes(p.status)).sort((a,b)=>a.followUp.localeCompare(b.followUp));return rows}
function counts(){let rows=all();return {total:rows.length,new:rows.filter(p=>p.status===STATUS.new).length,sent:rows.filter(p=>p.status===STATUS.sent).length,chats:rows.filter(p=>[STATUS.replied,STATUS.chat,STATUS.intro,STATUS.interested].includes(p.status)).length,due:inbox('due').length}}
function choose(){if(ui.tab==='detail'&&ui.selected)return lead(ui.selected);let a=inbox(ui.tab);if(ui.selected&&a.some(p=>p.id===ui.selected))return lead(ui.selected);return a.find(p=>!ui.skip.has(p.id))||null}

if(p.status===STATUS.new){
 if(tone==='short')return `Hi ${f}, great to connect! I came across your profile${co?` and noticed ${co}`:''}. Hope your week is going well.`;
 if(tone==='curious')return `Hi ${f}, great to connect! I noticed your work${org}${mid}. What kind of projects are keeping you busy these days?`;
 return `Hi ${f},\n\nGreat to connect! I came across your profile${co?` and saw your work with ${co}`:''}. It's always nice to meet people working on interesting things${mid}.\n\nHow has your week been going?`;
}
if(p.status===STATUS.sent){return `Hi ${f},\n\nJust wanted to follow up on my earlier hello. No rush at all — happy to connect whenever you have a moment.\n\nWishing you a great week!`;}
if(p.status===STATUS.replied){if(tone==='short')return `Thanks for getting back to me, ${f}! What are you currently working on${org}?`;if(tone==='curious')return `Nice hearing from you, ${f}! I'm curious — what's been the most exciting part of your work${org} recently?`;return `Hey ${f},\n\nThanks for replying! Good to hear from you. I'd love to learn a bit more about what you're focusing on${org} these days.\n\nWhat's been keeping you busy?`;}
if(p.status===STATUS.chat){if(tone==='short')return `By the way, ${f}, I work with ${sign} on creative and digital projects. If that's ever relevant to what you're working on, happy to exchange ideas.`;if(tone==='curious')return `That sounds interesting, ${f}. I'm part of ${sign}, where we work on content, design and digital growth. Curious — do creative projects or digital visibility play a role in your plans?`;return `That sounds interesting, ${f}!\n\nBy the way, I work with ${sign}. We help brands with creative content, websites and digital marketing. If any of that happens to be relevant to what you're building, I'd be happy to share a couple of ideas — only if useful.\n\nWhat are your current priorities?`;}
if(p.status===STATUS.intro){return `Hi ${f},\n\nThanks for the conversation so far. If it would be helpful, I can share one or two ideas relevant to ${co||'your work'} — no pressure at all.\n\nWould that be useful?`;}
if(p.status===STATUS.interested){return `Hi ${f},\n\nGreat talking with you! To make anything I share genuinely useful, what would you most like to improve right now — content, your website, or digital visibility?\n\nHappy to tailor a few ideas.`;}
return `Thanks for connecting, ${f}. Wishing you all the best!`}

function summary(c){return `<div class="summary"><button class="mini-stat" data-tab="all"><span class="stat-dot">♧</span><span><b>${c.total.toLocaleString('en-IN')}</b><small>All contacts</small></span></button><button class="mini-stat" data-tab="new"><span class="stat-dot">✳</span><span><b>${c.new.toLocaleString('en-IN')}</b><small>Ready for a hello</small></span></button><button class="mini-stat" data-tab="sent"><span class="stat-dot">↗</span><span><b>${c.sent.toLocaleString('en-IN')}</b><small>Awaiting a reply</small></span></button><button class="mini-stat" data-tab="chats"><span class="stat-dot">♡</span><span><b>${c.chats.toLocaleString('en-IN')}</b><small>Conversations</small></span></button></div>`}
function tabs(c){let entries=[['new','New connections',c.new],['sent','Awaiting replies',c.sent],['chats','Conversations',c.chats],['due','Follow-ups due',c.due],['all','All contacts',c.total],['settings','Settings',null]];return `<div class="tabs" role="tablist" aria-label="Outreach stages">${entries.map(([k,l,n])=>`<button class="tab ${ui.tab===k?'active':''}" role="tab" aria-selected="${ui.tab===k}" data-tab="${k}">${l}${n!==null?`<span class="num">${n}</span>`:''}</button>`).join('')}</div>`}
function notice(){return ui.flash?`<div class="flash"><strong>✳</strong><span>${esc(ui.flash)}</span>${ui.lastChange?'<button data-action="undo">Undo</button>':''}<button data-action="dismiss">✕</button></div>`:''}
function contact(p){let url=safeURL(p.url),email=String(p.email||'').trim(),co=safeCompany(p);return `<div class="panel panel-pad"><div class="panel-head"><div><div class="section-kicker">${esc(label(p))}</div><h2>Meet your contact</h2></div><div class="counter">${(ui.tab==='detail'?1:inbox(ui.tab).length).toLocaleString('en-IN')} in this view</div></div><div class="person-top"><div class="avatar">${esc(init(p))}</div><div><h3>${esc(p.name||'Unnamed')}</h3><p>${esc(roleText(p))}</p></div></div><div class="company">${esc(co||'Company not listed')}<small>${esc(p.industry&&p.industry!=='Unclassified'?p.industry:'Industry not specified')}</small></div><div class="chips"><span class="chip status">${esc(p.status)}</span><span class="chip">${esc(p.priority==='A'?'High priority':p.priority==='B'?'Medium priority':'Contact')}</span>${p.followUp?`<span class="chip">Follow-up: ${esc(p.followUp)}</span>`:''}</div><div class="contact-links">${url?`<a class="button small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ Open LinkedIn</a>`:''}${email?`<a class="button small" href="mailto:${encodeURIComponent(email)}">✉ Email</a>`:''}</div>${p.status===STATUS.new?`<div class="notice">Start with genuine networking. No service pitch in the first message. When you've actually sent the message yourself, confirm it on the right.</div>`:p.status===STATUS.sent?`<div class="notice">Waiting for their response? You can record a reply when it arrives, or send one polite follow-up when appropriate.</div>`:`<div class="notice">Keep the conversation authentic. Only introduce your services when it's relevant to what this person has shared.</div>`}<div class="detail-divider"></div><label class="field-label" for="reply-note">What did they reply? (optional)</label><textarea class="field text sm" id="reply-note" data-edit="reply" data-id="${esc(p.id)}" placeholder="Paste their actual reply here. This stays private in your browser.">${esc(p.replyText||'')}</textarea><div style="height:13px"></div><label class="field-label" for="contact-notes">Your notes</label><textarea class="field text sm" id="contact-notes" data-edit="notes" data-id="${esc(p.id)}" placeholder="Context, interests, next step...">${esc(p.notes||'')}</textarea><div class="subactions"><button class="button small" data-action="skip" data-id="${esc(p.id)}">Skip for now →</button>${p.status!==STATUS.new?`<button class="button plain small" data-action="set-status" data-id="${esc(p.id)}">Update status</button>`:''}</div></div>`}
function draftLabel(p){if(p.status===STATUS.new)return 'Friendly networking message';if(p.status===STATUS.sent)return 'Gentle follow-up (only when appropriate)';if(p.status===STATUS.replied)return 'Reply to their message';if(p.status===STATUS.chat)return 'Optional business introduction';return 'Continue the conversation'}
function actionsFor(p){if(p.status===STATUS.new)return `<button class="button purple" data-action="sent-next" data-id="${esc(p.id)}">✓ I sent it · Next person →</button>`;if(p.status===STATUS.sent)return `<button class="button purple" data-action="reply" data-id="${esc(p.id)}">↩ They replied · Open chat →</button>`;if(p.status===STATUS.replied)return `<button class="button purple" data-action="replied-next" data-id="${esc(p.id)}">✓ I replied · Next person →</button>`;if(p.status===STATUS.chat)return `<button class="button purple" data-action="intro-next" data-id="${esc(p.id)}">✓ Introduced my work · Next →</button>`;if(p.status===STATUS.intro)return `<button class="button purple" data-action="interested" data-id="${esc(p.id)}">♡ Mark interested</button>`;if(p.status===STATUS.interested)return `<button class="button purple" data-action="close" data-id="${esc(p.id)}">✓ Mark complete</button>`;return `<button class="button" data-action="reset" data-id="${esc(p.id)}">Move back to new</button>`}
function composer(p){const isNew=p.status===STATUS.new, isSent=p.status===STATUS.sent,isReply=p.status===STATUS.replied,isChat=p.status===STATUS.chat;
 const head=isNew?`<strong><span class="yellow">First friendship.</span> Not a sales pitch.</strong><p>Say hello, build a real connection, and wait for a reply before introducing business.</p>`:isSent?`<strong><span class="yellow">Let them reply.</span> Don't rush.</strong><p>You can mark their response here. Follow up politely only if it makes sense.</p>`:isReply?`<strong><span class="yellow">They replied!</span> Keep it natural.</strong><p>Ask about their work, respond to what they said and build a genuine conversation.</p>`:isChat?`<strong><span class="yellow">Only now:</span> optional business introduction.</strong><p>Introduce GS Enterprises Digital if your work is relevant. Never force a pitch.</p>`:`<strong><span class="yellow">Keep it human.</span> One conversation at a time.</strong><p>Useful ideas matter more than generic sales messages.</p>`;
return `<div class="panel panel-pad"><div class="panel-head"><div><div class="section-kicker">THE MESSAGE DESK</div><h2>Write something real ✳</h2></div><div class="counter">Personalized</div></div><div class="composer-banner">${head}</div><div class="draft-controls"><label class="field-label" for="message">${esc(draftLabel(p))}</label><div class="tone-group">${[['friendly','Warm'],['short','Short'],['curious','Curious']].map(([k,l])=>`<button class="tone ${ui.tone===k?'active':''}" data-tone="${k}">${l}</button>`).join('')}</div></div><textarea id="message" class="message" spellcheck="true" aria-label="Editable personalized message">${esc(textFor(p))}</textarea><div class="helper">Editable draft · ${esc(first(p))} &amp; ${esc(safeCompany(p)||'their work')} · No message is sent automatically.</div><div class="composer-buttons"><button class="button" data-action="copy" data-id="${esc(p.id)}">▣ Copy message</button>${actionsFor(p)}</div>${p.status===STATUS.sent?`<div class="subactions"><button class="button small" data-action="followed" data-id="${esc(p.id)}">✓ Follow-up sent</button><button class="button plain small" data-action="close" data-id="${esc(p.id)}">No reply · Archive</button></div>`:''}${p.status===STATUS.chat?`<div class="subactions"><button class="button plain small" data-action="keep-chat" data-id="${esc(p.id)}">Continue chatting without pitch</button></div>`:''}<div class="safe-note">Copying ≠ sending. Click the confirmation button only after you actually send the message on LinkedIn or email.</div></div>`}
function desk(){let p=choose();if(!p)return `<div class="panel wide empty"><div class="ball">✳</div><h3>You're all caught up</h3><p>${inbox(ui.tab).length?'You have reviewed everyone in this pass. Start again when you are ready.':ui.tab==='new'?'No new contacts left. Add more using Import CSV.':'No contacts in this stage yet. Switch tabs or import more contacts.'}</p><div class="row" style="justify-content:center"><button class="button" data-action="restart">↻ Review from beginning</button><button class="button purple" data-action="import">＋ Import contacts</button></div></div>`;return `<div class="desk">${contact(p)}${composer(p)}</div>`}
function listAll(){let rows=inbox('all');const q=normalize(ui.search);if(q)rows=rows.filter(p=>[p.name,p.company,p.title,p.email,p.industry,p.status].some(v=>normalize(v).includes(q)));let per=30,pages=Math.max(1,Math.ceil(rows.length/per));ui.page=Math.min(ui.page,pages);let chunk=rows.slice((ui.page-1)*per,ui.page*per);return `<div class="panel list-panel"><div class="list-header"><div><h2>Your contact library</h2><p>Search, open a contact, or update its stage. All contacts stay in your library after sending.</p></div><button class="button small" data-action="export-csv">↓ Export contacts CSV</button></div><div class="list-filters"><input class="field" id="search" placeholder="Search name, company, role, industry or status…" value="${esc(ui.search)}"><button class="button" data-action="add">＋ Add contact</button></div><div class="leadrows">${chunk.length?chunk.map(p=>`<button class="lead-row" data-open="${esc(p.id)}"><span class="a">${esc(init(p))}</span><span class="body"><b>${esc(p.name||'Unnamed')}</b><small>${esc(p.company||'Company not listed')} · ${esc(roleText(p))}</small></span><span class="end">${esc(p.status)} →</span></button>`).join(''):'<div class="empty">No matching contacts.</div>'}</div><div class="pager"><span>${rows.length.toLocaleString('en-IN')} contact(s) · page ${ui.page} of ${pages}</span><div class="row"><button class="button small" data-action="page-prev" ${ui.page===1?'disabled':''}>← Previous</button><button class="button small" data-action="page-next" ${ui.page>=pages?'disabled':''}>Next →</button></div></div></div>`}
function settings(){return `<div class="settings-wrap"><div class="panel"><h2>Simple settings &amp; secure backup</h2><p>Your workspace is private to this browser. It doesn't send messages, sync across devices or connect to a cloud database. Export JSON backups often; a public GitHub repository is not safe for files containing your contacts.</p><div class="settings-grid"><div><label class="field-label" for="sender">Signature / agency name</label><input class="field" id="sender" value="${esc(db.settings.sender||'GS Enterprises Digital')}"></div><div><label class="field-label" for="days">Follow-up after (days)</label><input class="field" id="days" type="number" min="2" max="90" value="${esc(db.settings.followDays||6)}"></div></div><div class="row"><button class="button purple" data-action="save-settings">Save settings</button><button class="button" data-action="backup">↓ Download full JSON backup</button><button class="button" data-action="export-csv">↓ Export CSV</button><button class="button" data-action="template">↓ Blank CSV template</button></div><div class="detail-divider"></div><p>Importing a new CSV adds only new contacts, skipping duplicates by LinkedIn URL, email or name + company. Existing stages, notes and messages are never overwritten.</p><div class="row"><button class="button sun" data-action="import">＋ Import a CSV or restore JSON</button></div><p style="margin-top:17px"><strong>Heads-up:</strong> The original embedded contacts are inside this HTML file. Do not upload it to a public GitHub Pages site.</p></div></div>`}
function render(){const c=counts();let selected=choose();app.innerHTML=`<div class="layout">${viewTop(c)}<main class="workspace"><div class="page-intro"><div><div class="section-kicker">✳ IDEAS INTO IMPACT</div><h1>Connections first.<br><em>Business later.</em></h1><p>Build genuine LinkedIn relationships, one personalized message at a time. Wait for their reply before introducing your services.</p></div><div class="safety-pill">🔒 Local-only workspace</div></div>${summary(c)}<div class="process"><div class="s"><span class="n">1</span>Friendly hello</div><span class="arr">→</span><div class="s"><span class="n">2</span>Wait for reply</div><span class="arr">→</span><div class="s"><span class="n">3</span>Real conversation</div><span class="arr">→</span><div class="s"><span class="n">4</span><b>Relevant business intro</b></div></div>${tabs(c)}${notice()}${ui.tab==='settings'?settings():ui.tab==='all'?listAll():desk()}<div class="footer">GS Enterprises Digital · Relationship-first outreach · <a target="_blank" rel="noopener noreferrer" href="https://gsenterprisesdigital-sudo.github.io/TESTING/">Visit your website ↗</a></div></main></div>`}
function switchTab(t){if(t==='settings')ui.tab=t;else ui.tab=['new','sent','chats','due','all'].includes(t)?t:'new';ui.selected=null;ui.skip.clear();ui.tone='friendly';ui.page=1;render();scrollTo({top:0,behavior:'instant'})}
function moveNext(id){ui.selected=null;ui.skip.add(id);ui.tone='friendly';render()}
function stage(id,status,msg,nextTab){const old=lead(id);if(!old)return;ui.lastChange={id,status:old.status,followUp:old.followUp||'',lastTouch:old.lastTouch||''};patch(id,{status,lastTouch:today(),followUp:status===STATUS.sent?addDays(db.settings.followDays):status!==STATUS.new?'':old.followUp||''},msg);ui.flash=`${old.name} → ${status}. ${nextTab?'Opened the conversation stage.':'Showing the next person.'}`;if(nextTab){ui.tab=nextTab;ui.selected=id;ui.tone='friendly';render()}else{if(ui.tab==='detail'){ui.tab=status===STATUS.new?'new':status===STATUS.sent?'sent':'chats'}moveNext(id)}}
function copy(text){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);const tmp=document.createElement('textarea');tmp.value=text;document.body.append(tmp);tmp.select();let worked=document.execCommand('copy');tmp.remove();return worked?Promise.resolve():Promise.reject(Error('Copy not supported'))}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csvCell(s){let t=String(s??'');return '"'+t.replace(/"/g,'""')+'"'}
function exportCsv(){let head=['Name','Company','Designation','Industry','LinkedIn URL','Email','Priority','Outreach Status','Last Touch','Follow Up','Notes','Reply'];const rows=all().map(p=>[p.name,p.company,p.title,p.industry,p.url,p.email,p.priority,p.status,p.lastTouch,p.followUp,p.notes,p.replyText]);download('GS_Relationship_Contacts_'+today()+'.csv','\uFEFF'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('GS_Relationship_Backup_'+today()+'.json',JSON.stringify({format:'gs_relationship_v2',created:new Date().toISOString(),seedCount:seed.length,db},null,2),'application/json');toast('Full JSON backup downloaded. Save it somewhere private.')}
function template(){let rows=[['Name','Company','Designation','Industry','LinkedIn URL','Email','Priority'],['Aarav Sharma','Example Company','Founder','Technology / software','https://www.linkedin.com/in/example-aarav','','B']];download('GS_Relationship_CSV_Template.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function csvParse(text){text=String(text||'').replace(/^\uFEFF/,'');const firstline=text.split(/\r?\n/)[0]||'';let delim=[',',';','\t'].map(x=>[x,firstline.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];let result=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c;continue}if(c==='"'&&!field){quote=true;continue}if(c===delim){row.push(field);field='';continue}if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(s=>s.trim()))result.push(row);row=[];field='';continue}field+=c}if(quote)throw Error('CSV has an unclosed quote');if(row.length||field){row.push(field);if(row.some(s=>s.trim()))result.push(row)}if(result.length<2)throw Error('CSV must have column headers and at least one contact');let headers=result.shift().map(s=>normalize(s).replace(/[^a-z0-9]+/g,' ').trim());return result.map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]||'').trim()]))) }
function get(r,...keys){for(let k of keys){let val=r[normalize(k).replace(/[^a-z0-9]+/g,' ').trim()];if(val)return val}return ''}
function normURL(s){return normalize(s).replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\?.*$/,'').replace(/\/+$/,'')}
function mergeCsv(text){let rows=csvParse(text),a=all(),links=new Set(a.map(p=>normURL(p.url)).filter(Boolean)),emails=new Set(a.map(p=>normalize(p.email)).filter(Boolean)),nc=new Set(a.map(p=>normalize(p.name)+'|'+normalize(p.company)).filter(p=>p!=='|')),nameless=0,added=0,duplicate=0;
for(let r of rows){let name=get(r,'name','full name','contact name')||[get(r,'first name','firstname'),get(r,'last name','lastname')].filter(Boolean).join(' ').trim();if(!name){nameless++;continue}let company=get(r,'company','company name','organization','organisation','current company'),url=get(r,'linkedin url','linkedin profile','linkedin profile url','profile url','linkedin','url','public profile url'),email=get(r,'email','email address','e mail');if(url&&!/^https?:\/\//i.test(url))url=/^(www\.)?linkedin\.com\//i.test(url)?'https://'+url:'';if(url&&!/^https?:\/\//i.test(url))url='';let lk=url?normURL(url):'',ek=normalize(email),nk=normalize(name)+'|'+normalize(company);if(lk&&links.has(lk)||ek&&emails.has(ek)||company&&nc.has(nk)){duplicate++;continue}let status=fromOldStatus(get(r,'outreach status','status')||STATUS.new);let priority=get(r,'priority','lead priority').toUpperCase();if(!['A','B','C','V'].includes(priority))priority='B';let n={id:randomId(),rank:seed.length+db.custom.length+1,name,company,title:get(r,'designation','title','job title','position','headline'),industry:get(r,'industry','industry inferred','sector')||'Unclassified',url,email,priority,score:Number(get(r,'fit score','score'))||75,status,notes:get(r,'notes'),lastTouch:get(r,'last touch','last contacted'),followUp:get(r,'follow up','next follow up'),replyText:get(r,'reply')};db.custom.push(n);if(lk)links.add(lk);if(ek)emails.add(ek);if(company)nc.add(nk);added++}save();ui.lastChange=null;ui.flash=`CSV imported: ${added} new contact(s), ${duplicate} duplicate(s) skipped, ${nameless} invalid row(s). Existing statuses and notes were preserved.`;ui.tab='new';ui.selected=null;ui.skip.clear();render();toast(`${added} contacts added · ${duplicate} duplicates skipped`)}
async function importFile(file){if(!file)return;let txt=await file.text();if(file.name.toLowerCase().endsWith('.json')){let o=JSON.parse(txt);if(o.format!=='gs_relationship_v2'||!o.db)throw Error('Invalid GS Relationship Studio backup');if(!confirm('Restore this backup? It will replace current browser data.'))return;db={...defaults(),...o.db,settings:{...defaults().settings,...o.db.settings}};save();ui.flash='Your backup was restored';switchTab('new');return}if(!/\.(csv|tsv|txt)$/i.test(file.name))throw Error('Choose a CSV or JSON backup');mergeCsv(txt)}
function addContact(){let name=prompt('Contact full name:');if(!name||!name.trim())return;let company=prompt('Company name (optional):')||'';let url=prompt('LinkedIn profile URL (optional):')||'';let existing=all().find(p=>url&&normURL(p.url)===normURL(url)||company&&normalize(p.name)===normalize(name)&&normalize(p.company)===normalize(company));if(existing){toast('Contact already exists');return}let p={id:randomId(),rank:seed.length+db.custom.length+1,name:name.trim(),company:company.trim(),url:safeURL(url),title:'',priority:'B',industry:'Unclassified',score:75,status:STATUS.new};db.custom.push(p);save();ui.tab='new';ui.selected=p.id;render();toast('Contact added')}
function manualStatus(id){let p=lead(id);if(!p)return;let opts=Object.values(STATUS);let choice=prompt('Change outreach status for '+p.name+' to one of these:\n'+opts.join(' / '),p.status);if(choice===null)return;let selected=opts.find(x=>normalize(x)===normalize(choice));if(!selected){toast('Choose a valid status from the list');return}stage(id,selected,'Manually updated stage to '+selected,selected===STATUS.replied?'chats':null)}
document.addEventListener('click',async event=>{const t=event.target.closest('[data-tab]');if(t){switchTab(t.dataset.tab);return}const tone=event.target.closest('[data-tone]');if(tone){let p=choose();if(p&&document.getElementById('message'))saveDraft(p.id,document.getElementById('message').value);ui.tone=tone.dataset.tone;render();return}const leadButton=event.target.closest('[data-open]');if(leadButton){let p=lead(leadButton.dataset.open);if(!p)return;ui.tab='detail';ui.selected=p.id;ui.skip.clear();render();return}const b=event.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,p=id?lead(id):null;
switch(a){case 'restart':ui.skip.clear();ui.selected=null;render();break;case 'import':document.getElementById('file').click();break;case 'backup':backup();break;case 'export-csv':exportCsv();break;case 'template':template();break;case 'dismiss':ui.flash='';ui.lastChange=null;render();break;case 'undo':{let old=ui.lastChange;if(old){patch(old.id,{status:old.status,followUp:old.followUp,lastTouch:old.lastTouch},'Undid last stage change');ui.tab=old.status===STATUS.new?'new':old.status===STATUS.sent?'sent':'chats';ui.selected=old.id;ui.skip.clear();ui.flash='Last stage change undone.';ui.lastChange=null;render();}break;}case 'add':addContact();break;case 'skip':ui.skip.add(id);ui.selected=null;render();break;case 'copy':try{await copy(document.getElementById('message')?.value||'');toast('Message copied. Send it manually, then confirm.')}catch(err){toast('Copy unavailable. Select the text and copy manually.')}break;case 'sent-next':stage(id,STATUS.sent,'Friendly hello sent');break;case 'reply':stage(id,STATUS.replied,'Reply received','chats');break;case 'replied-next':stage(id,STATUS.chat,'Replied and continued conversation');break;case 'intro-next':stage(id,STATUS.intro,'Introduced work after conversation');break;case 'interested':stage(id,STATUS.interested,'Contact expressed interest','chats');break;case 'close':stage(id,STATUS.closed,'Contact archived');break;case 'reset':stage(id,STATUS.new,'Contact reset','new');break;case 'followed':patch(id,{lastTouch:today(),followUp:addDays(Math.max(7,Number(db.settings.followDays)||6))},'One follow-up sent');moveNext(id);toast('Follow-up recorded');break;case 'keep-chat':toast('Keep the conversation natural. You can edit and copy a message any time.');break;case 'set-status':manualStatus(id);break;case 'page-next':ui.page++;render();break;case 'page-prev':ui.page=Math.max(1,ui.page-1);render();break;case 'save-settings':{let s=String(document.getElementById('sender')?.value||'').trim();db.settings.sender=s||'GS Enterprises Digital';db.settings.followDays=Math.max(2,Math.min(90,Number(document.getElementById('days')?.value)||6));save();toast('Settings saved');render();break}}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='message'){let p=choose();if(p)saveDraft(p.id,el.value)}else if(el.dataset.edit){patch(el.dataset.id,{[el.dataset.edit==='reply'?'replyText':'notes']:el.value},'')}else if(el.id==='search'){const pos=el.selectionStart;ui.search=el.value;ui.page=1;const list=app.querySelector('.leadrows');if(list){let rows=inbox('all'),q=normalize(ui.search);rows=rows.filter(p=>[p.name,p.company,p.title,p.email,p.industry,p.status].some(v=>normalize(v).includes(q)));list.innerHTML=rows.slice(0,30).map(p=>`<button class="lead-row" data-open="${esc(p.id)}"><span class="a">${esc(init(p))}</span><span class="body"><b>${esc(p.name)}</b><small>${esc(p.company||'Company not listed')} · ${esc(roleText(p))}</small></span><span class="end">${esc(p.status)} →</span></button>`).join('')||'<div class="empty">No matching contacts.</div>';const pager=app.querySelector('.pager span');if(pager)pager.textContent=rows.length+' contact(s) · page 1'}}});
document.getElementById('file').addEventListener('change',async ev=>{let file=ev.target.files[0];if(!file)return;try{await importFile(file)}catch(error){toast('Import failed: '+error.message)}finally{ev.target.value=''}});
render();
})();
</script>
</body>
